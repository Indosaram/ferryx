<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/ferryx-icon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Ferryx: follow and answer the agents running on your computer." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preload" href="/src/assets/geist-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/icon-192.png" as="image" type="image/png" />
    <title>Ferryx</title>
    <style>
      html,
      body {
        background: #0a0a0a;
        color: #fafafa;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot-splash img {
        width: 3rem;
        height: 3rem;
        border-radius: 0.75rem;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        50% { opacity: 0.5; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash img { animation: none; }
      }
    </style>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"><div id="boot-splash" role="status" aria-label="Loading Ferryx"><img src="/icon-192.png" alt="" /></div></div>
    <!-- Vite injects /@vite/client in dev; keeping a single app entry avoids duplicate HMR clients. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
