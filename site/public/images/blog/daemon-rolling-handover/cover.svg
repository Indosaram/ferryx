<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#0c2238" stop-opacity="0.95"/>
      <stop offset="42%" stop-color="#071524" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#02060c" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="centerBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#00aaff" stop-opacity="0.3"/>
      <stop offset="65%" stop-color="#38ef7d" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowLeft" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00a8ff" stop-opacity="0.4"/>
      <stop offset="65%" stop-color="#0044aa" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="55%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#38ef7d" stop-opacity="0.4"/>
      <stop offset="65%" stop-color="#00a896" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="cyanTealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>

    <linearGradient id="batonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0088ff"/>
      <stop offset="20%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>

    <linearGradient id="plateGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193554"/>
      <stop offset="50%" stop-color="#102338"/>
      <stop offset="100%" stop-color="#081422"/>
    </linearGradient>

    <linearGradient id="plateGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#17443f"/>
      <stop offset="50%" stop-color="#0f2f2c"/>
      <stop offset="100%" stop-color="#071b19"/>
    </linearGradient>

    <linearGradient id="armGradLeft" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#183452"/>
      <stop offset="50%" stop-color="#244d78"/>
      <stop offset="100%" stop-color="#0f2338"/>
    </linearGradient>

    <linearGradient id="armGradRight" x1="100%" y1="0%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#1a4742"/>
      <stop offset="50%" stop-color="#27635c"/>
      <stop offset="100%" stop-color="#0e2a27"/>
    </linearGradient>

    <linearGradient id="hornGradL" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0055bb"/>
      <stop offset="60%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <linearGradient id="hornGradR" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#007766"/>
      <stop offset="60%" stop-color="#00c988"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="22" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#102136" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="40" cy="40" r="1.2" fill="#1b3b61" fill-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="#02060c"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Subtle Horizon Beam & Center Flare -->
  <line x1="80" y1="262" x2="1120" y2="262" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.2"/>
  <circle cx="600" cy="262" r="190" fill="url(#centerBurst)"/>

  <!-- Minimalist HUD Corner Brackets -->
  <g stroke="#1b3b61" stroke-width="2" fill="none">
    <path d="M 36 36 L 36 68 M 36 36 L 68 36"/>
    <path d="M 1164 36 L 1164 68 M 1164 36 L 1132 36"/>
    <path d="M 36 594 L 36 562 M 36 594 L 68 594"/>
    <path d="M 1164 594 L 1164 562 M 1164 594 L 1132 594"/>
  </g>

  <!-- Top Terminal HUD Markers (No words, pure abstract telemetry shapes) -->
  <g fill="none" stroke="#1d4068" stroke-width="1.5">
    <rect x="56" y="44" width="10" height="10" rx="2" fill="#00f2fe" stroke="#00f2fe" filter="url(#glow)"/>
    <line x1="76" y1="49" x2="160" y2="49" stroke="#163252" stroke-dasharray="4 4"/>
    
    <g transform="translate(600, 49)">
      <circle cx="-36" cy="0" r="3.5" fill="#00a8ff" stroke="none"/>
      <circle cx="-12" cy="0" r="3.5" fill="#00f2fe" stroke="none" filter="url(#glow)"/>
      <circle cx="12" cy="0" r="3.5" fill="#38ef7d" stroke="none" filter="url(#glow)"/>
      <circle cx="36" cy="0" r="3.5" fill="#2eb872" stroke="none"/>
      <line x1="-80" y1="0" x2="-52" y2="0" stroke="#1d4068"/>
      <line x1="52" y1="0" x2="80" y2="0" stroke="#1d4068"/>
    </g>

    <rect x="1134" y="44" width="10" height="10" rx="2" fill="#38ef7d" stroke="#38ef7d" filter="url(#glow)"/>
    <line x1="1040" y1="49" x2="1124" y2="49" stroke="#163252" stroke-dasharray="4 4"/>
  </g>

  <!-- Flow Arcs and Transfer Stream -->
  <g fill="none">
    <!-- Curved Transfer Wave 1 -->
    <path d="M 270 230 C 420 135, 510 180, 600 240 C 690 300, 780 345, 930 250" 
          stroke="#0e2d4a" stroke-width="5" stroke-linecap="round"/>
    <path d="M 270 230 C 420 135, 510 180, 600 240 C 690 300, 780 345, 930 250" 
          stroke="url(#cyanTealGrad)" stroke-width="2.2" stroke-dasharray="10 8" filter="url(#glow)"/>

    <!-- Curved Transfer Wave 2 -->
    <path d="M 310 305 C 430 365, 510 320, 600 280 C 690 240, 770 175, 890 270" 
          stroke="#0e2d4a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 310 305 C 430 365, 510 320, 600 280 C 690 240, 770 175, 890 270" 
          stroke="#00f2fe" stroke-width="1.4" stroke-dasharray="6 6" opacity="0.75"/>

    <!-- Concentric Pulse Rings at Handover Hub -->
    <circle cx="600" cy="262" r="120" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 6"/>
    <circle cx="600" cy="262" r="75" stroke="#38ef7d" stroke-width="2" stroke-opacity="0.55" stroke-dasharray="4 4" filter="url(#glow)"/>
    <circle cx="600" cy="262" r="36" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.85"/>
  </g>

  <!-- ==================== DAEMON 1: OUTGOING / PREDECESSOR (LEFT) ==================== -->
  <g id="daemon-left" transform="translate(295, 252)">
    <!-- Daemon Ambient Aura -->
    <circle cx="-25" cy="10" r="170" fill="url(#glowLeft)"/>

    <!-- Geometric Daemon Horns / Antennas -->
    <!-- Outer Curved Horn -->
    <path d="M -85 -55 C -115 -100, -148 -135, -182 -155 C -152 -132, -120 -90, -95 -45 Z" 
          fill="url(#hornGradL)" filter="url(#glow)"/>
    <!-- Inner Horn -->
    <path d="M -45 -65 C -62 -115, -78 -150, -95 -172 C -78 -140, -62 -105, -50 -55 Z" 
          fill="url(#hornGradL)" opacity="0.9"/>

    <!-- Upper Chassis Cowl & Shoulder Panels -->
    <polygon points="-115,30 -90,-45 -35,-72 25,-42 35,18 0,85 -80,75 -120,40" 
             fill="url(#plateGradLeft)" stroke="#00a8ff" stroke-width="2.5" filter="url(#glow)"/>
    
    <!-- Torso Lower Armor Segment -->
    <polygon points="-85,68 -5,78 -18,142 -82,128" 
             fill="url(#plateGradLeft)" stroke="#163859" stroke-width="2"/>

    <!-- Inner Core & Faceplate Inset -->
    <polygon points="-75,-35 -35,-55 12,-32 18,10 -12,55 -68,46 -82,5" 
             fill="#050e18" stroke="#00f2fe" stroke-width="1.4" opacity="0.9"/>

    <!-- Glowing Cyber Visor -->
    <rect x="-60" y="-14" width="44" height="8" rx="4" fill="#00f2fe" filter="url(#glow)"/>
    <line x1="-55" y1="-10" x2="-20" y2="-10" stroke="#ffffff" stroke-width="2"/>

    <!-- Core Reactor Matrix -->
    <circle cx="-25" cy="22" r="15" fill="#091b2c" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
    <circle cx="-25" cy="22" r="7.5" fill="#00f2fe" filter="url(#intenseGlow)"/>
    <circle cx="-25" cy="22" r="3.5" fill="#ffffff"/>

    <!-- Circuit Inset Traces -->
    <path d="M -65 18 L -48 18 L -38 25" fill="none" stroke="#00a8ff" stroke-width="1.8"/>
    <path d="M -52 82 L -52 108 L -35 120" fill="none" stroke="#00f2fe" stroke-width="1.6"/>
    <circle cx="-35" cy="120" r="3" fill="#00f2fe"/>

    <!-- Floating Back Node Array -->
    <g fill="#0c1f33" stroke="#00a8ff" stroke-width="1.5">
      <rect x="-142" y="10" width="14" height="14" rx="3"/>
      <rect x="-148" y="34" width="14" height="14" rx="3"/>
      <rect x="-142" y="58" width="14" height="14" rx="3"/>
      <circle cx="-135" cy="17" r="2.5" fill="#00f2fe"/>
      <circle cx="-141" cy="41" r="2.5" fill="#00f2fe"/>
      <circle cx="-135" cy="65" r="2.5" fill="#00f2fe"/>
    </g>

    <!-- ================== ARTICULATED LEFT ARM ================== -->
    <!-- Shoulder Joint -->
    <circle cx="20" cy="30" r="20" fill="#0f263e" stroke="#00a8ff" stroke-width="3"/>
    <circle cx="20" cy="30" r="7" fill="#00f2fe" filter="url(#glow)"/>

    <!-- Upper Arm Segment -->
    <path d="M 28 22 L 102 16 L 106 42 L 24 48 Z" fill="url(#armGradLeft)" stroke="#1c4773" stroke-width="2.2"/>
    <line x1="34" y1="32" x2="98" y2="28" stroke="#00f2fe" stroke-width="2.5" stroke-opacity="0.85"/>

    <!-- Elbow Joint -->
    <circle cx="106" cy="31" r="15" fill="#0c2136" stroke="#00a8ff" stroke-width="2.2"/>
    <circle cx="106" cy="31" r="5" fill="#00f2fe" filter="url(#glow)"/>

    <!-- Forearm Segment -->
    <path d="M 115 22 L 205 10 L 208 32 L 112 42 Z" fill="url(#armGradLeft)" stroke="#1c4773" stroke-width="2.2"/>
    <line x1="120" y1="28" x2="200" y2="18" stroke="#00f2fe" stroke-width="3" filter="url(#glow)"/>

    <!-- Wrist Joint -->
    <circle cx="210" cy="20" r="11" fill="#0e273f" stroke="#00f2fe" stroke-width="2.2"/>

    <!-- Mechanical Claw Gripping Baton -->
    <path d="M 208 12 C 216 -4, 234 -12, 252 -10 L 256 -2 C 242 -4, 230 3, 222 14 Z" 
          fill="#112a42" stroke="#00f2fe" stroke-width="2.2" filter="url(#glow)"/>
    <path d="M 208 28 C 216 44, 234 52, 252 50 L 256 42 C 242 44, 230 37, 222 26 Z" 
          fill="#112a42" stroke="#00f2fe" stroke-width="2.2" filter="url(#glow)"/>
    <circle cx="254" cy="-6" r="4" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="254" cy="46" r="4" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- ==================== DAEMON 2: INCOMING / SUCCESSOR (RIGHT) ==================== -->
  <g id="daemon-right" transform="translate(905, 252)">
    <!-- Daemon Ambient Aura -->
    <circle cx="25" cy="10" r="170" fill="url(#glowRight)"/>

    <!-- Geometric Daemon Horns / Antennas -->
    <!-- Outer Curved Horn -->
    <path d="M 85 -55 C 115 -100, 148 -135, 182 -155 C 152 -132, 120 -90, 95 -45 Z" 
          fill="url(#hornGradR)" filter="url(#glow)"/>
    <!-- Inner Horn -->
    <path d="M 45 -65 C 62 -115, 78 -150, 95 -172 C 78 -140, 62 -105, 50 -55 Z" 
          fill="url(#hornGradR)" opacity="0.9"/>

    <!-- Upper Chassis Cowl & Shoulder Panels -->
    <polygon points="115,30 90,-45 35,-72 -25,-42 -35,18 0,85 80,75 120,40" 
             fill="url(#plateGradRight)" stroke="#38ef7d" stroke-width="2.5" filter="url(#glow)"/>
    
    <!-- Torso Lower Armor Segment -->
    <polygon points="85,68 5,78 18,142 82,128" 
             fill="url(#plateGradRight)" stroke="#164d44" stroke-width="2"/>

    <!-- Inner Core & Faceplate Inset -->
    <polygon points="75,-35 35,-55 -12,-32 -18,10 12,55 68,46 82,5" 
             fill="#041613" stroke="#38ef7d" stroke-width="1.4" opacity="0.9"/>

    <!-- Glowing Cyber Visor -->
    <rect x="16" y="-14" width="44" height="8" rx="4" fill="#38ef7d" filter="url(#glow)"/>
    <line x1="21" y1="-10" x2="56" y2="-10" stroke="#ffffff" stroke-width="2"/>

    <!-- Core Reactor Matrix -->
    <circle cx="25" cy="22" r="15" fill="#082620" stroke="#38ef7d" stroke-width="2" filter="url(#glow)"/>
    <circle cx="25" cy="22" r="7.5" fill="#38ef7d" filter="url(#intenseGlow)"/>
    <circle cx="25" cy="22" r="3.5" fill="#ffffff"/>

    <!-- Circuit Inset Traces -->
    <path d="M 65 18 L 48 18 L 38 25" fill="none" stroke="#00f2fe" stroke-width="1.8"/>
    <path d="M 52 82 L 52 108 L 35 120" fill="none" stroke="#38ef7d" stroke-width="1.6"/>
    <circle cx="35" cy="120" r="3" fill="#38ef7d"/>

    <!-- Floating Back Node Array -->
    <g fill="#0b2823" stroke="#38ef7d" stroke-width="1.5">
      <rect x="128" y="10" width="14" height="14" rx="3"/>
      <rect x="134" y="34" width="14" height="14" rx="3"/>
      <rect x="128" y="58" width="14" height="14" rx="3"/>
      <circle cx="135" cy="17" r="2.5" fill="#38ef7d"/>
      <circle cx="141" cy="41" r="2.5" fill="#38ef7d"/>
      <circle cx="135" cy="65" r="2.5" fill="#38ef7d"/>
    </g>

    <!-- ================== ARTICULATED RIGHT ARM ================== -->
    <!-- Shoulder Joint -->
    <circle cx="-20" cy="30" r="20" fill="#0f332c" stroke="#38ef7d" stroke-width="3"/>
    <circle cx="-20" cy="30" r="7" fill="#38ef7d" filter="url(#glow)"/>

    <!-- Upper Arm Segment -->
    <path d="M -28 22 L -102 16 L -106 42 L -24 48 Z" fill="url(#armGradRight)" stroke="#1d5c52" stroke-width="2.2"/>
    <line x1="-34" y1="32" x2="-98" y2="28" stroke="#38ef7d" stroke-width="2.5" stroke-opacity="0.85"/>

    <!-- Elbow Joint -->
    <circle cx="-106" cy="31" r="15" fill="#0c2b25" stroke="#38ef7d" stroke-width="2.2"/>
    <circle cx="-106" cy="31" r="5" fill="#38ef7d" filter="url(#glow)"/>

    <!-- Forearm Segment -->
    <path d="M -115 22 L -205 10 L -208 32 L -112 42 Z" fill="url(#armGradRight)" stroke="#1d5c52" stroke-width="2.2"/>
    <line x1="-120" y1="28" x2="-200" y2="18" stroke="#38ef7d" stroke-width="3" filter="url(#glow)"/>

    <!-- Wrist Joint -->
    <circle cx="-210" cy="20" r="11" fill="#0e332a" stroke="#38ef7d" stroke-width="2.2"/>

    <!-- Mechanical Claw Receiving Baton -->
    <path d="M -208 12 C -216 -4, -234 -12, -252 -10 L -256 -2 C -242 -4, -230 3, -222 14 Z" 
          fill="#11362e" stroke="#38ef7d" stroke-width="2.2" filter="url(#glow)"/>
    <path d="M -208 28 C -216 44, -234 52, -252 50 L -256 42 C -242 44, -230 37, -222 26 Z" 
          fill="#11362e" stroke="#38ef7d" stroke-width="2.2" filter="url(#glow)"/>
    <circle cx="-254" cy="-6" r="4" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="-254" cy="46" r="4" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- ==================== THE BATON (THE CENTRAL RELAY HANDOFF) ==================== -->
  <g id="baton-handoff" transform="translate(600, 270)">
    <!-- High-Intensity Background Radial Flare -->
    <ellipse cx="0" cy="0" rx="140" ry="52" fill="url(#centerBurst)"/>

    <!-- Energy Field Arcs around Baton -->
    <path d="M -145 -22 C -65 -46, 65 -46, 145 -22" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="6 4" opacity="0.75" filter="url(#glow)"/>
    <path d="M -145 22 C -65 46, 65 46, 145 22" fill="none" stroke="#38ef7d" stroke-width="2" stroke-dasharray="6 4" opacity="0.75" filter="url(#glow)"/>

    <!-- Main Baton Outer Metallic Body Capsule -->
    <rect x="-130" y="-20" width="260" height="40" rx="20" 
          fill="#051626" stroke="url(#cyanTealGrad)" stroke-width="3.2" filter="url(#glow)"/>

    <!-- Glowing Core Baton Tube -->
    <rect x="-110" y="-12" width="220" height="24" rx="12" 
          fill="url(#batonGlow)" filter="url(#intenseGlow)"/>

    <!-- Super-Bright Filament Line Through Center -->
    <line x1="-95" y1="0" x2="95" y2="0" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

    <!-- Segmented Chamber Dividers -->
    <g stroke="#04121f" stroke-width="4">
      <line x1="-65" y1="-18" x2="-65" y2="18"/>
      <line x1="-22" y1="-18" x2="-22" y2="18"/>
      <line x1="22" y1="-18" x2="22" y2="18"/>
      <line x1="65" y1="-18" x2="65" y2="18"/>
    </g>

    <!-- Torus Rings Encircling Baton -->
    <ellipse cx="-65" cy="0" rx="10" ry="26" fill="none" stroke="#00f2fe" stroke-width="2.2" filter="url(#glow)"/>
    <ellipse cx="0" cy="0" rx="11" ry="29" fill="none" stroke="#ffffff" stroke-width="3" filter="url(#glow)"/>
    <ellipse cx="65" cy="0" rx="10" ry="26" fill="none" stroke="#38ef7d" stroke-width="2.2" filter="url(#glow)"/>

    <!-- Particle Nodes Radiating along Handoff Path -->
    <circle cx="-140" cy="0" r="4" fill="#00f2fe" filter="url(#glow)"/>
    <circle cx="-90" cy="-30" r="3" fill="#00f2fe"/>
    <circle cx="-40" cy="32" r="3" fill="#00f2fe"/>
    <circle cx="40" cy="-32" r="3" fill="#38ef7d"/>
    <circle cx="90" cy="30" r="3" fill="#38ef7d"/>
    <circle cx="140" cy="0" r="4" fill="#38ef7d" filter="url(#glow)"/>
  </g>

  <!-- ==================== CLEAN DEVELOPER TEXT (MAX 3 WORDS) ==================== -->
  <g transform="translate(600, 528)" text-anchor="middle">
    <!-- Exactly 3 words of text: ROLLING DAEMON HANDOVER -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'JetBrains Mono', 'Helvetica Neue', sans-serif" 
          font-size="46" font-weight="800" letter-spacing="3" fill="#ffffff">
      ROLLING <tspan fill="#00f2fe">DAEMON</tspan> <tspan fill="#38ef7d">HANDOVER</tspan>
    </text>

    <!-- Glowing Accent Base Rule -->
    <line x1="-300" y1="24" x2="300" y2="24" stroke="url(#cyanTealGrad)" stroke-width="2.5" opacity="0.85" filter="url(#glow)"/>
    <circle cx="-300" cy="24" r="3.5" fill="#00f2fe"/>
    <circle cx="300" cy="24" r="3.5" fill="#38ef7d"/>
  </g>
</svg>
