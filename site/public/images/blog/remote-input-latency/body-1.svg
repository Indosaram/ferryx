<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#070b12; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b12" />
      <stop offset="50%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>

    <!-- Radial Soft Glows -->
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-teal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121b2d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0b111e" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="subcard-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162238" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f1728" stop-opacity="0.9" />
    </linearGradient>

    <!-- Line Gradients -->
    <linearGradient id="tx-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="rx-line-grad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Card Drop Shadow -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow-tx" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#34d399" />
    </marker>
    <marker id="arrow-rx" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-down" viewBox="0 0 12 12" refX="6" refY="9" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 2 1 L 6 10 L 10 1 z" fill="#06b6d4" />
    </marker>

    <!-- Subtle Grid -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="900" fill="url(#bg-grad)" />
  <rect width="1600" height="900" fill="url(#grid)" />

  <!-- Radial Background Ambient Lights -->
  <circle cx="280" cy="380" r="380" fill="url(#glow-cyan)" />
  <circle cx="1320" cy="380" r="380" fill="url(#glow-teal)" />

  <!-- ================= HEADER SECTION ================= -->
  <g transform="translate(100, 68)">
    <rect x="0" y="0" width="206" height="28" rx="14" fill="#0e2a38" stroke="#0891b2" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="16" cy="14" r="4" fill="#22d3ee" />
    <text x="112" y="18" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">ROUND-TRIP BREAKDOWN</text>
    
    <text x="0" y="66" fill="#f8fafc" font-size="30" font-weight="700" letter-spacing="-0.5">Understanding Remote Terminal Input Latency</text>
    <text x="0" y="94" fill="#94a3b8" font-size="15" font-weight="400">Step-by-step trace of an interactive keystroke from client event to terminal screen update</text>
  </g>

  <!-- ================= NETWORK TRANSIT AREA (CENTER) ================= -->
  <!-- Network container dashed box -->
  <rect x="500" y="210" width="600" height="370" rx="20" fill="#0c1322" fill-opacity="0.45" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 6" />
  <text x="800" y="244" fill="#64748b" font-size="13" font-weight="600" letter-spacing="2" text-anchor="middle">BIDIRECTIONAL NETWORK TRANSIT</text>

  <!-- ================= FLOW LINES ================= -->

  <!-- OUTBOUND (UPLINK): Client (x=460) -> Host (x=1140) at y=320 -->
  <!-- Outer Glow line -->
  <line x1="460" y1="320" x2="1136" y2="320" stroke="#06b6d4" stroke-width="6" stroke-opacity="0.25" stroke-linecap="round" />
  <!-- Crisp core line with arrow -->
  <line x1="460" y1="320" x2="1136" y2="320" stroke="url(#tx-line-grad)" stroke-width="2.5" marker-end="url(#arrow-tx)" />

  <!-- Outbound Data Packet Box -->
  <g transform="translate(710, 286)">
    <rect width="180" height="52" rx="10" fill="#0c1a2e" stroke="#0284c7" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="90" y="23" fill="#e0f2fe" font-size="13" font-weight="600" text-anchor="middle">Keystroke Packet</text>
    <text x="90" y="40" fill="#38bdf8" font-size="11" font-weight="500" text-anchor="middle">Uplink Transit · t_tx</text>
  </g>

  <!-- RTT Summary Indicator (Middle) -->
  <g transform="translate(715, 375)">
    <rect width="170" height="32" rx="16" fill="#091322" stroke="#334155" stroke-width="1.2" />
    <circle cx="20" cy="16" r="4" fill="#06b6d4" />
    <text x="98" y="20" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">RTT = t_tx + t_rx</text>
  </g>

  <!-- INBOUND (DOWNLINK): Host (x=1140) -> Client (x=460) at y=465 -->
  <!-- Outer Glow line -->
  <line x1="1140" y1="465" x2="464" y2="465" stroke="#059669" stroke-width="6" stroke-opacity="0.25" stroke-linecap="round" />
  <!-- Crisp core line with arrow -->
  <line x1="1140" y1="465" x2="464" y2="465" stroke="url(#rx-line-grad)" stroke-width="2.5" marker-end="url(#arrow-rx)" />

  <!-- Inbound Data Packet Box -->
  <g transform="translate(710, 440)">
    <rect width="180" height="52" rx="10" fill="#072024" stroke="#0d9488" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="90" y="23" fill="#ccfbf1" font-size="13" font-weight="600" text-anchor="middle">PTY Echo Stream</text>
    <text x="90" y="40" fill="#2dd4bf" font-size="11" font-weight="500" text-anchor="middle">Downlink Transit · t_rx</text>
  </g>

  <!-- ================= LEFT COLUMN: LOCAL CLIENT ================= -->
  <g transform="translate(100, 210)" filter="url(#card-shadow)">
    <!-- Container -->
    <rect width="360" height="370" rx="18" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.5" />
    <!-- Header banner -->
    <path d="M 0 18 Q 0 0 18 0 L 342 0 Q 360 0 360 18 L 360 52 L 0 52 Z" fill="#15233c" fill-opacity="0.6" />
    <circle cx="28" cy="26" r="6" fill="#38bdf8" />
    <text x="44" y="31" fill="#f8fafc" font-size="16" font-weight="700">Local Client</text>
    <text x="336" y="31" fill="#64748b" font-size="12" font-weight="500" text-anchor="end">Terminal Emulator</text>

    <!-- Sub-block 1: Input Event -->
    <g transform="translate(20, 75)">
      <rect width="320" height="84" rx="12" fill="url(#subcard-grad)" stroke="#223654" stroke-width="1.2" />
      <rect x="14" y="16" width="48" height="52" rx="8" fill="#131e33" stroke="#38bdf8" stroke-width="1.5" />
      <text x="38" y="47" fill="#38bdf8" font-size="20" font-weight="700" text-anchor="middle">K</text>
      
      <text x="74" y="36" fill="#f8fafc" font-size="14" font-weight="600">Input Dispatch</text>
      <text x="74" y="55" fill="#94a3b8" font-size="12">OS key event &amp; encoding</text>
      
      <rect x="236" y="16" width="70" height="22" rx="6" fill="#0284c7" fill-opacity="0.25" stroke="#0284c7" stroke-width="1" />
      <text x="271" y="31" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">t_input</text>
    </g>

    <!-- Vertical Client Connector Arrow -->
    <line x1="180" y1="172" x2="180" y2="238" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 4" />

    <!-- Sub-block 2: VT Parser & GPU Render -->
    <g transform="translate(20, 250)">
      <rect width="320" height="92" rx="12" fill="url(#subcard-grad)" stroke="#1a3d4d" stroke-width="1.2" />
      <rect x="14" y="20" width="48" height="52" rx="8" fill="#0f2631" stroke="#2dd4bf" stroke-width="1.5" />
      <text x="38" y="51" fill="#2dd4bf" font-size="17" font-weight="700" text-anchor="middle">&gt;_</text>
      
      <text x="74" y="38" fill="#f8fafc" font-size="14" font-weight="600">VT Parser &amp; Render</text>
      <text x="74" y="57" fill="#94a3b8" font-size="12">ANSI decode &amp; GPU draw</text>
      <text x="74" y="74" fill="#64748b" font-size="11">Display refresh / VSync</text>
      
      <rect x="236" y="20" width="70" height="22" rx="6" fill="#0d9488" fill-opacity="0.25" stroke="#0d9488" stroke-width="1" />
      <text x="271" y="35" fill="#2dd4bf" font-size="11" font-weight="600" text-anchor="middle">t_render</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: REMOTE HOST ================= -->
  <g transform="translate(1140, 210)" filter="url(#card-shadow)">
    <!-- Container -->
    <rect width="360" height="370" rx="18" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.5" />
    <!-- Header banner -->
    <path d="M 0 18 Q 0 0 18 0 L 342 0 Q 360 0 360 18 L 360 52 L 0 52 Z" fill="#132c32" fill-opacity="0.6" />
    <circle cx="28" cy="26" r="6" fill="#10b981" />
    <text x="44" y="31" fill="#f8fafc" font-size="16" font-weight="700">Remote Host</text>
    <text x="336" y="31" fill="#64748b" font-size="12" font-weight="500" text-anchor="end">Server / Container</text>

    <!-- Sub-block 1: SSH Daemon -->
    <g transform="translate(20, 75)">
      <rect width="320" height="84" rx="12" fill="url(#subcard-grad)" stroke="#163e3b" stroke-width="1.2" />
      <rect x="14" y="16" width="48" height="52" rx="8" fill="#0f2621" stroke="#10b981" stroke-width="1.5" />
      <text x="38" y="47" fill="#10b981" font-size="15" font-weight="700" text-anchor="middle">SSH</text>
      
      <text x="74" y="36" fill="#f8fafc" font-size="14" font-weight="600">Daemon &amp; Decrypt</text>
      <text x="74" y="55" fill="#94a3b8" font-size="12">Socket unpack &amp; decryption</text>
      
      <rect x="236" y="16" width="70" height="22" rx="6" fill="#047857" fill-opacity="0.25" stroke="#047857" stroke-width="1" />
      <text x="271" y="31" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">t_ssh</text>
    </g>

    <!-- Internal Host Processing Flow Arrow -->
    <line x1="180" y1="168" x2="180" y2="240" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-down)" />

    <!-- Sub-block 2: PTY Driver & Shell -->
    <g transform="translate(20, 250)">
      <rect width="320" height="92" rx="12" fill="url(#subcard-grad)" stroke="#1c3852" stroke-width="1.2" />
      <rect x="14" y="20" width="48" height="52" rx="8" fill="#12233b" stroke="#06b6d4" stroke-width="1.5" />
      <text x="38" y="52" fill="#06b6d4" font-size="15" font-weight="700" text-anchor="middle">PTY</text>
      
      <text x="74" y="38" fill="#f8fafc" font-size="14" font-weight="600">PTY Driver &amp; Shell</text>
      <text x="74" y="57" fill="#94a3b8" font-size="12">Kernel tty driver &amp; echo</text>
      <text x="74" y="74" fill="#64748b" font-size="11">bash / zsh / tmux process</text>
      
      <rect x="236" y="20" width="70" height="22" rx="6" fill="#0284c7" fill-opacity="0.25" stroke="#0284c7" stroke-width="1" />
      <text x="271" y="35" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">t_pty</text>
    </g>
  </g>

  <!-- ================= BOTTOM SECTION: LATENCY BREAKDOWN TIMELINE ================= -->
  <g transform="translate(100, 620)" filter="url(#card-shadow)">
    <!-- Timeline Card Container -->
    <rect width="1400" height="210" rx="18" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Header -->
    <text x="36" y="42" fill="#f8fafc" font-size="17" font-weight="700">End-to-End Latency Composition</text>
    <text x="1364" y="42" fill="#38bdf8" font-size="14" font-weight="600" font-family="ui-monospace, SFMono-Regular, monospace" text-anchor="end">T_total = t_input + t_tx + (t_ssh + t_pty) + t_rx + t_render</text>

    <!-- Multi-stage Bar Breakdown -->
    <g transform="translate(36, 68)">
      <!-- Stage 1: Local Input -->
      <g transform="translate(0, 0)">
        <rect width="150" height="52" rx="10" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1.5" />
        <text x="75" y="25" fill="#e0f2fe" font-size="13" font-weight="600" text-anchor="middle">Local Input</text>
        <text x="75" y="42" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">2 – 8 ms</text>
      </g>

      <!-- Stage 2: Uplink Network -->
      <g transform="translate(160, 0)">
        <rect width="420" height="52" rx="10" fill="#0891b2" fill-opacity="0.2" stroke="#0891b2" stroke-width="1.5" />
        <text x="210" y="25" fill="#cffafe" font-size="13" font-weight="600" text-anchor="middle">Network Uplink Transit (t_tx)</text>
        <text x="210" y="42" fill="#22d3ee" font-size="11" font-weight="600" text-anchor="middle">15 – 50 ms (WAN)</text>
      </g>

      <!-- Stage 3: Remote Host Processing -->
      <g transform="translate(590, 0)">
        <rect width="190" height="52" rx="10" fill="#059669" fill-opacity="0.2" stroke="#059669" stroke-width="1.5" />
        <text x="95" y="25" fill="#d1fae5" font-size="13" font-weight="600" text-anchor="middle">Host PTY + Shell</text>
        <text x="95" y="42" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">1 – 5 ms</text>
      </g>

      <!-- Stage 4: Downlink Network -->
      <g transform="translate(790, 0)">
        <rect width="420" height="52" rx="10" fill="#0891b2" fill-opacity="0.2" stroke="#0891b2" stroke-width="1.5" />
        <text x="210" y="25" fill="#cffafe" font-size="13" font-weight="600" text-anchor="middle">Network Downlink Transit (t_rx)</text>
        <text x="210" y="42" fill="#22d3ee" font-size="11" font-weight="600" text-anchor="middle">15 – 50 ms (WAN)</text>
      </g>

      <!-- Stage 5: Frame Render -->
      <g transform="translate(1220, 0)">
        <rect width="108" height="52" rx="10" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1.5" />
        <text x="54" y="25" fill="#e0f2fe" font-size="13" font-weight="600" text-anchor="middle">Render</text>
        <text x="54" y="42" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">4 – 16 ms</text>
      </g>
    </g>

    <!-- Legend and Key Insights -->
    <g transform="translate(36, 156)">
      <circle cx="8" cy="8" r="5" fill="#38bdf8" />
      <text x="22" y="12" fill="#cbd5e1" font-size="13" font-weight="500">Client Terminal Engine (~6 – 24 ms)</text>

      <circle cx="380" cy="8" r="5" fill="#22d3ee" />
      <text x="394" y="12" fill="#cbd5e1" font-size="13" font-weight="500">Network RTT (Primary bottleneck across regions)</text>

      <circle cx="920" cy="8" r="5" fill="#34d399" />
      <text x="934" y="12" fill="#cbd5e1" font-size="13" font-weight="500">Server Kernel &amp; PTY Buffer (&lt;5 ms typical)</text>
    </g>
  </g>
</svg>
