<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <filter id="teal-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#2dd4bf" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 2 2 L 7 5 L 2 8" fill="none" stroke="#52525b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 2 2 L 7 5 L 2 8" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="#0b0b0d"/>

  <!-- Arrow 1 -->
  <line x1="395" y1="250" x2="465" y2="250" stroke="#52525b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/>

  <!-- Arrow 2 -->
  <line x1="735" y1="250" x2="805" y2="250" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-teal)"/>

  <!-- Box 1: Active -->
  <rect x="145" y="195" width="230" height="110" rx="16" fill="#131418" stroke="#2e313d" stroke-width="1.5"/>
  <text x="260" y="250" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="600" fill="#f4f4f5" text-anchor="middle" dominant-baseline="central" letter-spacing="-0.01em">Active</text>

  <!-- Box 2: Sleep -->
  <rect x="485" y="195" width="230" height="110" rx="16" fill="#0e0f13" stroke="#282a36" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="600" y="250" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="500" fill="#71717a" text-anchor="middle" dominant-baseline="central" letter-spacing="-0.01em">Sleep</text>

  <!-- Box 3: Still Active -->
  <rect x="825" y="195" width="230" height="110" rx="16" fill="#0c1817" stroke="#2dd4bf" stroke-width="2" filter="url(#teal-glow)"/>
  <text x="940" y="250" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="600" fill="#2dd4bf" text-anchor="middle" dominant-baseline="central" letter-spacing="-0.01em">Still Active</text>
</svg>
