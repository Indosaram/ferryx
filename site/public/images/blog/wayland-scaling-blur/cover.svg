<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0e2438" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#081524" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#040810" stop-opacity="1"/>
    </radialGradient>

    <!-- Terminal Window Gradients -->
    <linearGradient id="termBgLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121c"/>
      <stop offset="100%" stop-color="#0e1724"/>
    </linearGradient>

    <linearGradient id="termBgRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091829"/>
      <stop offset="100%" stop-color="#0b1e33"/>
    </linearGradient>

    <linearGradient id="termHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121e2e"/>
      <stop offset="50%" stop-color="#15263a"/>
      <stop offset="100%" stop-color="#122030"/>
    </linearGradient>

    <linearGradient id="cyanTealBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="85%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Heavy Bilinear Blur Filter for the left side (representing blurry scaling) -->
    <filter id="blurryScale" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" />
    </filter>

    <filter id="subtleBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.0" />
    </filter>

    <!-- Dark Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#102033" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="40" cy="40" r="1" fill="#183654" fill-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Deep Terminal Canvas -->
  <rect width="1200" height="630" fill="#040810"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- HUD Corner Brackets -->
  <g stroke="#1b395c" stroke-width="2" fill="none">
    <path d="M 36 36 L 36 68 M 36 36 L 68 36" />
    <path d="M 1164 36 L 1164 68 M 1164 36 L 1132 36" />
    <path d="M 36 594 L 36 562 M 36 594 L 68 594" />
    <path d="M 1164 594 L 1164 562 M 1164 594 L 1132 594" />
  </g>

  <!-- Peripheral Circuit Traces -->
  <g stroke="#00f2fe" stroke-width="1.2" fill="none" opacity="0.3">
    <!-- Left trace lines -->
    <path d="M 60 160 L 120 160 L 160 210 L 160 260" />
    <circle cx="60" cy="160" r="3" fill="#00f2fe"/>
    <path d="M 80 430 L 130 430 L 160 380 L 160 340" />
    <circle cx="80" cy="430" r="3" fill="#00f2fe"/>

    <!-- Right trace lines -->
    <path d="M 1140 160 L 1080 160 L 1040 210 L 1040 260" />
    <circle cx="1140" cy="160" r="3" fill="#10b981"/>
    <path d="M 1120 430 L 1070 430 L 1040 380 L 1040 340" />
    <circle cx="1120" cy="430" r="3" fill="#10b981"/>
  </g>

  <!-- ==================== MAIN TERMINAL COMPARISON WINDOW ==================== -->
  <g transform="translate(160, 95)">
    <!-- Outer Window Container Shadow & Frame (880 x 370) -->
    <rect x="-1" y="-1" width="882" height="372" rx="13" fill="none" stroke="url(#cyanTealBorder)" stroke-width="1.5" opacity="0.5" filter="url(#softGlow)"/>
    <rect x="0" y="0" width="880" height="370" rx="12" fill="#070d17" stroke="#162e4a" stroke-width="1.5"/>

    <!-- Terminal Header Bar -->
    <path d="M 0 12 Q 0 0 12 0 L 868 0 Q 880 0 880 12 L 880 42 L 0 42 Z" fill="url(#termHeaderGrad)"/>
    <line x1="0" y1="42" x2="880" y2="42" stroke="#1a3554" stroke-width="1.2"/>

    <!-- Window Control Dots -->
    <circle cx="24" cy="21" r="5" fill="#f87171" opacity="0.8"/>
    <circle cx="42" cy="21" r="5" fill="#fbbf24" opacity="0.8"/>
    <circle cx="60" cy="21" r="5" fill="#34d399" opacity="0.8"/>

    <!-- Header Center Notch / Indicator Tabs -->
    <g transform="translate(370, 11)">
      <!-- Left mode pill: Blurry scaling indicator -->
      <rect x="0" y="0" width="62" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <line x1="14" y1="10" x2="48" y2="10" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" filter="url(#subtleBlur)"/>

      <!-- Arrow -->
      <path d="M 68 10 L 74 10 M 72 7 L 75 10 L 72 13" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- Right mode pill: Sharp HiDPI indicator -->
      <rect x="80" y="0" width="62" height="20" rx="4" fill="#0a2538" stroke="#00f2fe" stroke-width="1.2" filter="url(#softGlow)"/>
      <line x1="94" y1="10" x2="128" y2="10" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Header Status Icons on Far Right -->
    <g transform="translate(815, 14)" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.7">
      <rect x="0" y="0" width="14" height="14" rx="2"/>
      <line x1="3" y1="7" x2="11" y2="7"/>
      <line x1="24" y1="2" x2="36" y2="2"/>
      <line x1="24" y1="7" x2="36" y2="7"/>
      <line x1="24" y1="12" x2="32" y2="12"/>
    </g>

    <!-- ==================== LEFT HALF: BLURRY / BILINEAR SCALING ==================== -->
    <g clip-path="url(#leftClip)">
      <clipPath id="leftClip">
        <rect x="0" y="42" width="440" height="328"/>
      </clipPath>

      <!-- Left Background -->
      <rect x="0" y="42" width="440" height="328" fill="url(#termBgLeft)"/>

      <!-- Subtle Bilinear Scaling Pixelation/Grid Artifacts -->
      <g stroke="#1a2738" stroke-width="0.8" opacity="0.35">
        <line x1="0" y1="80" x2="440" y2="80"/>
        <line x1="0" y1="120" x2="440" y2="120"/>
        <line x1="0" y1="160" x2="440" y2="160"/>
        <line x1="0" y1="200" x2="440" y2="200"/>
        <line x1="0" y1="240" x2="440" y2="240"/>
        <line x1="0" y1="280" x2="440" y2="280"/>
        <line x1="0" y1="320" x2="440" y2="320"/>
      </g>

      <!-- Blurred Abstract Code & Glyphs Content -->
      <g filter="url(#blurryScale)" opacity="0.65">
        <!-- Prompt glyph (blurred) -->
        <path d="M 35 78 L 47 88 L 35 98" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
        <rect x="58" y="80" width="85" height="15" rx="3" fill="#60a5fa"/>
        <rect x="153" y="80" width="130" height="15" rx="3" fill="#cbd5e1"/>
        <rect x="293" y="80" width="90" height="15" rx="3" fill="#38bdf8"/>

        <!-- Output lines (blurry, smeared fractional scaling) -->
        <rect x="35" y="112" width="220" height="13" rx="3" fill="#64748b"/>
        <rect x="265" y="112" width="110" height="13" rx="3" fill="#f87171" opacity="0.7"/>

        <rect x="35" y="140" width="310" height="13" rx="3" fill="#64748b"/>
        <rect x="355" y="140" width="50" height="13" rx="3" fill="#facc15" opacity="0.7"/>

        <rect x="55" y="168" width="180" height="13" rx="3" fill="#94a3b8"/>
        <rect x="245" y="168" width="140" height="13" rx="3" fill="#64748b"/>

        <rect x="55" y="196" width="260" height="13" rx="3" fill="#64748b"/>

        <!-- Next prompt (blurry) -->
        <path d="M 35 236 L 47 246 L 35 256" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
        <rect x="58" y="238" width="115" height="15" rx="3" fill="#38bdf8"/>
        <rect x="183" y="238" width="140" height="15" rx="3" fill="#cbd5e1"/>

        <!-- Blurry cursor -->
        <rect x="333" y="236" width="12" height="19" rx="2" fill="#38bdf8"/>

        <!-- Status bar lines -->
        <rect x="35" y="278" width="190" height="12" rx="3" fill="#475569"/>
        <rect x="235" y="278" width="120" height="12" rx="3" fill="#475569"/>
        <rect x="35" y="304" width="290" height="12" rx="3" fill="#334155"/>
      </g>

      <!-- Soft haze / chromatic fringe indicator on blurry side -->
      <rect x="20" y="55" width="400" height="295" fill="none" stroke="#f43f5e" stroke-width="1" stroke-dasharray="8 8" opacity="0.15"/>
    </g>

    <!-- ==================== RIGHT HALF: CRISP / RAZOR-SHARP HiDPI ==================== -->
    <g clip-path="url(#rightClip)">
      <clipPath id="rightClip">
        <rect x="440" y="42" width="440" height="328"/>
      </clipPath>

      <!-- Right Background -->
      <rect x="440" y="42" width="440" height="328" fill="url(#termBgRight)"/>

      <!-- Sharp Pixel Grid (High DPI) -->
      <g stroke="#163250" stroke-width="0.6" opacity="0.35">
        <line x1="440" y1="80" x2="880" y2="80"/>
        <line x1="440" y1="120" x2="880" y2="120"/>
        <line x1="440" y1="160" x2="880" y2="160"/>
        <line x1="440" y1="200" x2="880" y2="200"/>
        <line x1="440" y1="240" x2="880" y2="240"/>
        <line x1="440" y1="280" x2="880" y2="280"/>
        <line x1="440" y1="320" x2="880" y2="320"/>
      </g>

      <!-- Ultra-Sharp Code & Abstract Glyphs Content -->
      <g opacity="0.95">
        <!-- Prompt glyph (crisp, glowing teal vector) -->
        <path d="M 475 78 L 487 88 L 475 98" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)"/>
        <rect x="498" y="81" width="85" height="14" rx="2" fill="#38bdf8"/>
        <rect x="593" y="81" width="130" height="14" rx="2" fill="#e2e8f0"/>
        <rect x="733" y="81" width="90" height="14" rx="2" fill="#00f2fe" filter="url(#softGlow)"/>

        <!-- Output lines (crisp, vector sharp, perfect edges) -->
        <rect x="475" y="113" width="220" height="12" rx="2" fill="#94a3b8"/>
        <rect x="705" y="113" width="110" height="12" rx="2" fill="#34d399"/>

        <rect x="475" y="141" width="310" height="12" rx="2" fill="#94a3b8"/>
        <rect x="795" y="141" width="50" height="12" rx="2" fill="#38ef7d" filter="url(#softGlow)"/>

        <rect x="495" y="169" width="180" height="12" rx="2" fill="#cbd5e1"/>
        <rect x="685" y="169" width="140" height="12" rx="2" fill="#94a3b8"/>

        <rect x="495" y="197" width="260" height="12" rx="2" fill="#94a3b8"/>

        <!-- Next prompt (razor-sharp) -->
        <path d="M 475 236 L 487 246 L 475 256" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)"/>
        <rect x="498" y="239" width="115" height="14" rx="2" fill="#00f2fe"/>
        <rect x="623" y="239" width="140" height="14" rx="2" fill="#ffffff"/>

        <!-- Sharp glowing cursor -->
        <rect x="773" y="237" width="12" height="18" rx="2" fill="#00f2fe" filter="url(#softGlow)"/>
        <rect x="775" y="239" width="8" height="14" rx="1" fill="#ffffff"/>

        <!-- Status bar lines with crisp badges -->
        <rect x="475" y="279" width="190" height="11" rx="2" fill="#64748b"/>
        <rect x="675" y="279" width="120" height="11" rx="2" fill="#10b981" filter="url(#softGlow)"/>
        <rect x="475" y="305" width="290" height="11" rx="2" fill="#475569"/>
      </g>
    </g>

    <!-- ==================== VERTICAL SPLIT LASER DIVIDER ==================== -->
    <g transform="translate(440, 42)">
      <!-- Neon Laser Glow -->
      <line x1="0" y1="0" x2="0" y2="328" stroke="#00f2fe" stroke-width="6" opacity="0.4" filter="url(#neonGlow)"/>
      <line x1="0" y1="0" x2="0" y2="328" stroke="#38bdf8" stroke-width="3" opacity="0.8"/>
      <!-- Core bright white razor wire -->
      <line x1="0" y1="0" x2="0" y2="328" stroke="#ffffff" stroke-width="1.5"/>

      <!-- Center Comparison Slider Diamond / Handle -->
      <g transform="translate(0, 164)">
        <circle cx="0" cy="0" r="16" fill="#0a1b2d" stroke="#00f2fe" stroke-width="2" filter="url(#neonGlow)"/>
        <circle cx="0" cy="0" r="10" fill="#0d263f" stroke="#ffffff" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="4" fill="#00f2fe"/>

        <!-- Dual directional arrow ticks -->
        <path d="M -6 0 L -4 -3 M -6 0 L -4 3" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M 6 0 L 4 -3 M 6 0 L 4 3" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
      </g>

      <!-- Top and Bottom Alignment Ticks -->
      <circle cx="0" cy="8" r="3" fill="#ffffff" filter="url(#softGlow)"/>
      <circle cx="0" cy="320" r="3" fill="#ffffff" filter="url(#softGlow)"/>
    </g>
  </g>

  <!-- ==================== CLEAN DEVELOPER TEXT (MAX 3 WORDS) ==================== -->
  <g transform="translate(600, 532)" text-anchor="middle">
    <!-- Exactly 3 words: WAYLAND SCALING FIX -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'JetBrains Mono', sans-serif" font-size="42" font-weight="800" letter-spacing="2" fill="#ffffff">
      WAYLAND <tspan fill="#00f2fe">SCALING</tspan> <tspan fill="#38ef7d">FIX</tspan>
    </text>

    <!-- Glowing baseline accent line -->
    <line x1="-220" y1="22" x2="220" y2="22" stroke="url(#cyanTealBorder)" stroke-width="2" opacity="0.75" filter="url(#softGlow)"/>
  </g>
</svg>