<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111217" />
      <stop offset="100%" stop-color="#0b0b0d" />
    </radialGradient>

    <!-- Subtle glow for highlighted box -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <marker id="teal-arrow" viewBox="0 0 16 16" refX="12" refY="8" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 2 3 L 14 8 L 2 13 z" fill="#2dd4bf" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="900" fill="#0b0b0d" />

  <!-- Box 1: Dimmed (Left) -->
  <rect x="220" y="350" width="420" height="200" rx="24" fill="#121318" stroke="#262935" stroke-width="2" />
  <text x="430" y="468" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="500" fill="#64748b" text-anchor="middle">Pane Tree</text>

  <!-- Arrow: A -> B -->
  <line x1="700" y1="450" x2="890" y2="450" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" marker-end="url(#teal-arrow)" />

  <!-- Box 2: Highlighted (Right) with subtle glow -->
  <rect x="960" y="350" width="420" height="200" rx="24" fill="#0a1f24" stroke="#2dd4bf" stroke-width="3" filter="url(#glow)" />
  <text x="1170" y="468" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="700" fill="#2dd4bf" text-anchor="middle">Serialized</text>
</svg>