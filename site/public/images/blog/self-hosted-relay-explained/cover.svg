<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgRadial" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0a1d33" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#06101f" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#03070f" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="tunnelCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#0077ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="houseAmbient" cx="40%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#0055aa" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="remoteAmbient" cx="60%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#38ef7d" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#0077ff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="cyanTealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#00c3ff"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>

    <linearGradient id="tunnelBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1"/>
      <stop offset="20%" stop-color="#00f2fe" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#38ef7d" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#00c3ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0077ff" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="tunnelShield" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38ef7d" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="houseBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10253d"/>
      <stop offset="50%" stop-color="#0a1728"/>
      <stop offset="100%" stop-color="#060e1a"/>
    </linearGradient>

    <linearGradient id="houseRoofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#183e66"/>
      <stop offset="100%" stop-color="#0d2238"/>
    </linearGradient>

    <linearGradient id="terminalCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2238"/>
      <stop offset="40%" stop-color="#091524"/>
      <stop offset="100%" stop-color="#050c17"/>
    </linearGradient>

    <linearGradient id="pipeSleeveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e4670"/>
      <stop offset="50%" stop-color="#0f263f"/>
      <stop offset="100%" stop-color="#081726"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="wideGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="hyperGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#122338" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#1b3b5f" fill-opacity="0.75"/>
    </pattern>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="630" fill="#040811"/>
  <rect width="1200" height="630" fill="url(#bgRadial)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient Light Fields -->
  <circle cx="280" cy="270" r="260" fill="url(#houseAmbient)"/>
  <circle cx="600" cy="270" r="280" fill="url(#tunnelCoreGlow)"/>
  <circle cx="940" cy="270" r="240" fill="url(#remoteAmbient)"/>

  <!-- HUD Corner Brackets -->
  <g stroke="#1e3e63" stroke-width="2" fill="none">
    <path d="M 36 36 L 36 68 M 36 36 L 68 36" />
    <path d="M 1164 36 L 1164 68 M 1164 36 L 1132 36" />
    <path d="M 36 594 L 36 562 M 36 594 L 68 594" />
    <path d="M 1164 594 L 1164 562 M 1164 594 L 1132 594" />
  </g>

  <!-- Top Metadata Status Bar -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'JetBrains Mono', monospace" font-size="11" fill="#4d769e" letter-spacing="1.5">
    <circle cx="64" cy="48" r="3" fill="#00f2fe" filter="url(#glow)"/>
    <text x="76" y="52">FERRYX // RELAY ARCHITECTURE</text>
    
    <circle cx="760" cy="48" r="3" fill="#38ef7d" filter="url(#glow)"/>
    <text x="774" y="52">OUTBOUND ESTABLISHED [NO INBOUND PORTS]</text>
  </g>

  <!-- Background Data Traces -->
  <g stroke="#00f2fe" stroke-width="1" fill="none" opacity="0.22">
    <!-- Homelab traces -->
    <path d="M 80 140 L 180 140 L 220 180 L 220 220" />
    <circle cx="80" cy="140" r="2.5" fill="#00f2fe" />
    <path d="M 90 420 L 160 420 L 200 380 L 240 380" />
    <circle cx="90" cy="420" r="2.5" fill="#00f2fe" />

    <!-- Relay backbone traces -->
    <path d="M 520 110 L 600 110 L 640 150 L 720 150" />
    <path d="M 480 430 L 560 430 L 600 390 L 680 390" />
    
    <!-- Remote endpoint traces -->
    <path d="M 1020 140 L 1110 140" />
    <circle cx="1110" cy="140" r="2.5" fill="#38ef7d" />
    <path d="M 990 420 L 1060 420 L 1100 380 L 1130 380" />
    <circle cx="1130" cy="380" r="2.5" fill="#38ef7d" />
  </g>

  <!-- ==================== THE OUTBOUND TUNNEL (CENTER CONDUIT) ==================== -->
  <!-- Outer Tunnel Hull / Boundary Tube -->
  <g transform="translate(0, 0)">
    <!-- Shaded Tunnel Aura -->
    <path d="M 330 235 L 850 235 L 850 305 L 330 305 Z" fill="url(#tunnelShield)" />

    <!-- Upper & Lower Tunnel Guide Rails -->
    <line x1="300" y1="230" x2="880" y2="230" stroke="#163959" stroke-width="3" />
    <line x1="300" y1="230" x2="880" y2="230" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="16 8" opacity="0.6" />
    
    <line x1="300" y1="310" x2="880" y2="310" stroke="#163959" stroke-width="3" />
    <line x1="300" y1="310" x2="880" y2="310" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="16 8" opacity="0.6" />

    <!-- Central High-Velocity Encrypted Tunnel Core Beam -->
    <line x1="300" y1="270" x2="880" y2="270" stroke="url(#tunnelBeam)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
    <line x1="320" y1="270" x2="860" y2="270" stroke="#ffffff" stroke-width="1.5" opacity="0.8" filter="url(#glow)"/>

    <!-- Concentric Tunnel Rings / Compression Collars -->
    <!-- Collar 1 (near house exit) -->
    <g transform="translate(370, 270)">
      <ellipse cx="0" cy="0" rx="14" ry="46" fill="none" stroke="#1e4d7a" stroke-width="3"/>
      <ellipse cx="0" cy="0" rx="14" ry="46" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="8 6" filter="url(#glow)"/>
      <circle cx="0" cy="-46" r="3" fill="#00f2fe" filter="url(#glow)"/>
      <circle cx="0" cy="46" r="3" fill="#00f2fe" filter="url(#glow)"/>
    </g>

    <!-- Collar 2 -->
    <g transform="translate(470, 270)">
      <ellipse cx="0" cy="0" rx="14" ry="46" fill="none" stroke="#1e4d7a" stroke-width="3"/>
      <ellipse cx="0" cy="0" rx="14" ry="46" fill="none" stroke="#00c3ff" stroke-width="1.8" stroke-dasharray="6 6" filter="url(#glow)"/>
    </g>

    <!-- Relay Midpoint Hub / Router Node -->
    <g transform="translate(590, 270)">
      <circle cx="0" cy="0" r="48" fill="#091729" stroke="#1b3f66" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.7"/>
      <circle cx="0" cy="0" r="30" fill="#0c1f36" stroke="#38ef7d" stroke-width="2" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="10" fill="#00f2fe" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>

      <!-- Orbiting Node Indicators -->
      <line x1="0" y1="-48" x2="0" y2="-64" stroke="#00f2fe" stroke-width="1.5" filter="url(#glow)"/>
      <circle cx="0" cy="-68" r="4" fill="#00f2fe" filter="url(#glow)"/>
      <line x1="0" y1="48" x2="0" y2="64" stroke="#38ef7d" stroke-width="1.5" filter="url(#glow)"/>
      <circle cx="0" cy="68" r="4" fill="#38ef7d" filter="url(#glow)"/>

      <!-- Protocol Badge -->
      <rect x="-38" y="80" width="76" height="20" rx="4" fill="#0a192b" stroke="#00f2fe" stroke-width="1" opacity="0.8"/>
      <text x="0" y="94" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00f2fe" text-anchor="middle" letter-spacing="1">RELAY HUB</text>
    </g>

    <!-- Collar 3 -->
    <g transform="translate(710, 270)">
      <ellipse cx="0" cy="0" rx="14" ry="46" fill="none" stroke="#1e4d7a" stroke-width="3"/>
      <ellipse cx="0" cy="0" rx="14" ry="46" fill="none" stroke="#38ef7d" stroke-width="1.8" stroke-dasharray="6 6" filter="url(#glow)"/>
    </g>

    <!-- Collar 4 (near remote terminal entry) -->
    <g transform="translate(810, 270)">
      <ellipse cx="0" cy="0" rx="14" ry="46" fill="none" stroke="#1e4d7a" stroke-width="3"/>
      <ellipse cx="0" cy="0" rx="14" ry="46" fill="none" stroke="#38ef7d" stroke-width="2" stroke-dasharray="8 6" filter="url(#glow)"/>
      <circle cx="0" cy="-46" r="3" fill="#38ef7d" filter="url(#glow)"/>
      <circle cx="0" cy="46" r="3" fill="#38ef7d" filter="url(#glow)"/>
    </g>

    <!-- Directional Outbound Chevron Pulses -->
    <g stroke="#00f2fe" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#glow)">
      <!-- Wave 1 (leaving house) -->
      <path d="M 405 260 L 417 270 L 405 280" />
      <path d="M 420 260 L 432 270 L 420 280" opacity="0.6"/>

      <!-- Wave 2 (past relay hub) -->
      <path d="M 645 260 L 657 270 L 645 280" stroke="#38ef7d"/>
      <path d="M 660 260 L 672 270 L 660 280" stroke="#38ef7d" opacity="0.6"/>

      <!-- Wave 3 (entering remote terminal) -->
      <path d="M 750 260 L 762 270 L 750 280" stroke="#00c3ff"/>
      <path d="M 765 260 L 777 270 L 765 280" stroke="#00c3ff" opacity="0.6"/>
    </g>

    <!-- Floating High-Energy Packet Sparks -->
    <circle cx="350" cy="270" r="3.5" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="510" cy="270" r="4.5" fill="#00f2fe" filter="url(#glow)"/>
    <circle cx="770" cy="270" r="4" fill="#38ef7d" filter="url(#glow)"/>
  </g>

  <!-- ==================== LEFT: THE HOUSE (HOMELAB / HOST NODE) ==================== -->
  <g id="house-node" transform="translate(195, 270)">
    <!-- House Outer Glow Aura -->
    <polygon points="0,-140 105,-40 105,120 -105,120 -105,-40" fill="#00f2fe" opacity="0.04" filter="url(#wideGlow)"/>

    <!-- House Foundation & Walls -->
    <rect x="-95" y="-35" width="190" height="150" rx="10" fill="url(#houseBodyGrad)" stroke="#1a3f68" stroke-width="2.5"/>

    <!-- Gable Roof (Clean Angular Silhouette) -->
    <polygon points="0,-130 110,-35 -110,-35" fill="url(#houseRoofGrad)" stroke="#22548a" stroke-width="2.5"/>
    <!-- Roof Neon Edge (Outbound Tech Accent) -->
    <polyline points="-110,-35 0,-130 110,-35" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Chimney / High-Gain Antenna Stub -->
    <rect x="42" y="-105" width="18" height="35" rx="3" fill="#0d233a" stroke="#1d4875" stroke-width="1.5"/>
    <line x1="51" y1="-105" x2="51" y2="-125" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
    <circle cx="51" cy="-127" r="3.5" fill="#00f2fe" filter="url(#glow)"/>
    <path d="M 43 -119 A 10 10 0 0 1 59 -119" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.7"/>

    <!-- Roof Vent / Tech Crest -->
    <polygon points="0,-95 24,-75 -24,-75" fill="#091626" stroke="#00f2fe" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="-80" r="3" fill="#00f2fe"/>

    <!-- Internal Terminal / Server Rack Bay Window -->
    <rect x="-70" y="-15" width="140" height="115" rx="8" fill="#040b15" stroke="#19385c" stroke-width="2"/>
    <rect x="-70" y="-15" width="140" height="22" rx="8" fill="#0c1d30"/>
    
    <!-- Window Control Dots -->
    <circle cx="-54" cy="-4" r="3.5" fill="#ef4444" opacity="0.8"/>
    <circle cx="-42" cy="-4" r="3.5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="-30" cy="-4" r="3.5" fill="#10b981" opacity="0.8"/>
    <text x="24" y="-1" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#4d769e" letter-spacing="1">HOST:LOCAL</text>

    <!-- Server Rack Slots Inside Window -->
    <!-- Slot 1 -->
    <rect x="-60" y="16" width="120" height="22" rx="4" fill="#091726" stroke="#14314f" stroke-width="1"/>
    <circle cx="-48" cy="27" r="2.5" fill="#00f2fe" filter="url(#glow)"/>
    <circle cx="-38" cy="27" r="2.5" fill="#38ef7d" filter="url(#glow)"/>
    <line x1="-24" y1="27" x2="45" y2="27" stroke="#1b3f63" stroke-width="2" stroke-linecap="round"/>

    <!-- Slot 2 (Active Relay Daemon) -->
    <rect x="-60" y="44" width="120" height="22" rx="4" fill="#0a1d33" stroke="#00f2fe" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="-48" cy="55" r="3" fill="#00f2fe" filter="url(#glow)"/>
    <circle cx="-38" cy="55" r="2" fill="#ffffff"/>
    <text x="-24" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00f2fe" letter-spacing="0.5">pty-relay &gt;&gt;</text>
    <rect x="36" y="51" width="14" height="8" rx="2" fill="#38ef7d" opacity="0.9"/>

    <!-- Slot 3 -->
    <rect x="-60" y="72" width="120" height="20" rx="4" fill="#091726" stroke="#14314f" stroke-width="1"/>
    <circle cx="-48" cy="82" r="2.5" fill="#38ef7d"/>
    <line x1="-38" y1="82" x2="20" y2="82" stroke="#1b3f63" stroke-width="2" stroke-linecap="round"/>

    <!-- Outbound Port Aperture / Egress Hatch (Right Side of House) -->
    <rect x="88" y="-21" width="22" height="42" rx="4" fill="#0e243a" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
    <ellipse cx="99" cy="0" rx="5" ry="14" fill="#00f2fe" opacity="0.8" filter="url(#glow)"/>
    <!-- Internal conduit trace to hatch -->
    <path d="M 60 55 L 76 55 L 88 0" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>

    <!-- NAT Firewall Shield Indicator (Vertical dotted boundary behind house) -->
    <g transform="translate(122, 0)">
      <line x1="0" y1="-130" x2="0" y2="135" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.45"/>
      <rect x="-6" y="-150" width="70" height="18" rx="3" fill="#180c10" stroke="#ef4444" stroke-width="1" opacity="0.8"/>
      <text x="29" y="-138" font-family="'JetBrains Mono', monospace" font-size="8" fill="#f87171" text-anchor="middle" letter-spacing="0.8">NAT / FW</text>
      <!-- One-way arrow through firewall -->
      <path d="M -6 0 L 14 0 M 8 -6 L 14 0 L 8 6" fill="none" stroke="#38ef7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    </g>

    <!-- Node Title Pill -->
    <rect x="-65" y="128" width="130" height="24" rx="5" fill="#071322" stroke="#193b61" stroke-width="1.5"/>
    <circle cx="-46" cy="140" r="3" fill="#00f2fe" filter="url(#glow)"/>
    <text x="-32" y="144" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93c5fd" font-weight="600" letter-spacing="1">HOMELAB NODE</text>
  </g>

  <!-- ==================== RIGHT: REMOTE TERMINAL (CLIENT ENDPOINT) ==================== -->
  <g id="remote-node" transform="translate(975, 270)">
    <!-- Terminal Outer Aura -->
    <rect x="-105" y="-105" width="210" height="210" rx="14" fill="#38ef7d" opacity="0.04" filter="url(#wideGlow)"/>

    <!-- Main Terminal Chassis / Window -->
    <rect x="-100" y="-95" width="200" height="190" rx="12" fill="url(#terminalCardGrad)" stroke="#1d4875" stroke-width="2.5"/>
    <rect x="-100" y="-95" width="200" height="190" rx="12" fill="none" stroke="#38ef7d" stroke-width="1.2" opacity="0.4"/>

    <!-- Terminal Window Title Bar -->
    <rect x="-100" y="-95" width="200" height="30" rx="12" fill="#0a1a2e"/>
    <rect x="-100" y="-75" width="200" height="10" fill="#0a1a2e"/>
    <line x1="-100" y1="-65" x2="100" y2="-65" stroke="#163554" stroke-width="1.5"/>

    <!-- Terminal Window Buttons -->
    <circle cx="-80" cy="-80" r="4" fill="#ef4444" opacity="0.8"/>
    <circle cx="-66" cy="-80" r="4" fill="#f59e0b" opacity="0.8"/>
    <circle cx="-52" cy="-80" r="4" fill="#10b981" opacity="0.8"/>
    <text x="10" y="-76" font-family="'JetBrains Mono', monospace" font-size="9" fill="#5885b0" letter-spacing="1">tty@remote-mac</text>

    <!-- Terminal Screen Interior -->
    <rect x="-88" y="-53" width="176" height="135" rx="6" fill="#030811" stroke="#132c47" stroke-width="1"/>

    <!-- Shell Prompts and Command Output -->
    <g font-family="'JetBrains Mono', monospace" font-size="9.5" letter-spacing="0.5">
      <!-- Line 1: Inbound Relay Session Connected -->
      <text x="-76" y="-32" fill="#4d769e">$ <tspan fill="#93c5fd">ferryx attach</tspan></text>
      <text x="-76" y="-14" fill="#00f2fe" opacity="0.85">[tunnel: established]</text>
      
      <!-- Line 2: Shell Prompt Active -->
      <text x="-76" y="8" fill="#38ef7d">home-daemon:~$</text>
      <text x="-76" y="26" fill="#e2e8f0">htop --tree</text>

      <!-- Terminal Cursor Block -->
      <rect x="-8" y="16" width="7" height="12" fill="#38ef7d" opacity="0.85" filter="url(#glow)"/>

      <!-- Simulated Minimal Terminal Data Matrix -->
      <g opacity="0.55" font-size="8">
        <text x="-76" y="46" fill="#64748b">PID USER   VIRT  RES S</text>
        <text x="-76" y="60" fill="#38bdf8"> 42 ferry 1.2G 184M S</text>
        <text x="-76" y="72" fill="#00f2fe"> 48 relay 256M  32M S</text>
      </g>
    </g>

    <!-- Ingress Collar (Left Side of Remote Window) -->
    <rect x="-114" y="-20" width="18" height="40" rx="4" fill="#0e243a" stroke="#38ef7d" stroke-width="2" filter="url(#glow)"/>
    <ellipse cx="-105" cy="0" rx="4" ry="12" fill="#38ef7d" opacity="0.85" filter="url(#glow)"/>

    <!-- Node Title Pill -->
    <rect x="-70" y="105" width="140" height="24" rx="5" fill="#071322" stroke="#193b61" stroke-width="1.5"/>
    <circle cx="-50" cy="117" r="3" fill="#38ef7d" filter="url(#glow)"/>
    <text x="-36" y="121" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a7f3d0" font-weight="600" letter-spacing="1">REMOTE CLIENT</text>
  </g>

  <!-- ==================== CLEAN DEVELOPER TEXT (MAX 3 WORDS) ==================== -->
  <g transform="translate(600, 542)" text-anchor="middle">
    <!-- Exactly 3 words: SELF-HOSTED RELAY TUNNEL or SELF-HOSTED REMOTE RELAY or SELF-HOSTED TERMINAL RELAY -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'JetBrains Mono', sans-serif" font-size="44" font-weight="800" letter-spacing="3" fill="#ffffff">
      SELF-HOSTED <tspan fill="#00f2fe">TERMINAL</tspan> <tspan fill="#38ef7d">RELAY</tspan>
    </text>

    <!-- Glowing Baseline Accent Line -->
    <line x1="-250" y1="22" x2="250" y2="22" stroke="url(#cyanTealGrad)" stroke-width="2.5" opacity="0.75" filter="url(#glow)"/>
    <circle cx="0" cy="22" r="4" fill="#00f2fe" filter="url(#glow)"/>
  </g>
</svg>
