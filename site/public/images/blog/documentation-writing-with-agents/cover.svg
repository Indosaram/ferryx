    <g transform="translate(30, 292)">
      <rect x="0" y="0" width="150" height="26" rx="13" fill="#042a24" stroke="#059669" stroke-width="1.2"/>
      <circle cx="14" cy="13" r="4.5" fill="#00f5d4" filter="url(#glow)"/>
      <rect x="26" y="10" width="75" height="6" rx="3" fill="#d1fae5"/>
      <rect x="108" y="10" width="28" height="6" rx="3" fill="#34d399"/>
