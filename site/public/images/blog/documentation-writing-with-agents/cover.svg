  <!-- ==================== ACCENT SENSORS & CORNER BRACKETS ==================== -->
  <path d="M 40 60 L 40 40 L 60 40" fill="none" stroke="#1e40af" stroke-width="2"/>
  <path d="M 1160 60 L 1160 40 L 1140 40" fill="none" stroke="#065f46" stroke-width="2"/>
  <path d="M 40 570 L 40 590 L 60 590" fill="none" stroke="#1e40af" stroke-width="2"/>
  <path d="M 1160 570 L 1160 590 L 1140 590" fill="none" stroke="#065f46" stroke-width="2"/>

  <!-- ==================== BOTTOM TITLE SECTION (EXACTLY 3 WORDS) ==================== -->
  <g transform="translate(600, 526)" text-anchor="middle">
    <!-- Exactly 3 words of text: PARALLEL AGENT DOCS -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'JetBrains Mono', sans-serif" 
          font-size="50" font-weight="800" letter-spacing="4" fill="#ffffff">
      PARALLEL <tspan fill="#00f2fe">AGENT</tspan> <tspan fill="#00f5d4">DOCS</tspan>
    </text>

    <!-- Glowing Accent Base Rule with Center Pip -->
    <line x1="-340" y1="25" x2="340" y2="25" stroke="url(#cyanTealLine)" stroke-width="2.6" filter="url(#glow)"/>
    <circle cx="-340" cy="25" r="3.5" fill="#00f2fe"/>
    <circle cx="0" cy="25" r="5" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="340" cy="25" r="3.5" fill="#00f5d4"/>
  </g>
</svg>