<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 2 2 L 10 6 L 2 10 z" fill="#2dd4bf" stroke="#2dd4bf" stroke-width="0.5" stroke-linejoin="round"/>
    </marker>
    <!-- Subtle Box Glow for Accent Boxes -->
    <filter id="teal-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#2dd4bf" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background: #0b0b0d -->
  <rect width="1600" height="900" fill="#0b0b0d"/>

  <!-- Connecting Arrows (exactly 2 arrows) -->
  <path d="M 640 450 C 770 450, 830 305, 956 305" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 640 450 C 770 450, 830 595, 956 595" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Box 1 (Dimmed/Base): Monorepo -->
  <rect x="280" y="380" width="360" height="140" rx="18" fill="#14151a" stroke="#2c2d38" stroke-width="2"/>
  <text x="460" y="450" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="-0.02em" text-anchor="middle" dominant-baseline="central">Monorepo</text>

  <!-- Box 2 (Highlighted): Worktree 1 -->
  <rect x="960" y="235" width="360" height="140" rx="18" fill="#0d1f22" stroke="#2dd4bf" stroke-width="2.5" filter="url(#teal-glow)"/>
  <text x="1140" y="305" fill="#2dd4bf" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="-0.02em" text-anchor="middle" dominant-baseline="central">Worktree 1</text>

  <!-- Box 3 (Highlighted): Worktree 2 -->
  <rect x="960" y="525" width="360" height="140" rx="18" fill="#0d1f22" stroke="#2dd4bf" stroke-width="2.5" filter="url(#teal-glow)"/>
  <text x="1140" y="595" fill="#2dd4bf" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="-0.02em" text-anchor="middle" dominant-baseline="central">Worktree 2</text>
</svg>