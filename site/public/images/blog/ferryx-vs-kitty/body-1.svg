<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#2dd4bf" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0b0b0d" />

  <!-- Kitty Box (dimmed / secondary) -->
  <rect x="130" y="195" width="380" height="240" rx="20" fill="#13141a" stroke="#272730" stroke-width="2" />
  <text x="320" y="295" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="600" fill="#a1a1aa" text-anchor="middle">Kitty</text>
  <text x="320" y="355" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="500" fill="#71717a" text-anchor="middle">Single Process</text>

  <!-- Contrast Arrow -->
  <g stroke="#2dd4bf" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="540" y1="315" x2="660" y2="315" />
    <path d="M 646 303 L 660 315 L 646 327" />
  </g>

  <!-- Ferryx Box (bold highlighted) -->
  <rect x="690" y="195" width="380" height="240" rx="20" fill="#0e1726" stroke="#2dd4bf" stroke-width="2.5" filter="url(#glow)" />
  <text x="880" y="295" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff" text-anchor="middle">Ferryx</text>
  <text x="880" y="355" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#2dd4bf" text-anchor="middle">Headless Daemon</text>
</svg>
