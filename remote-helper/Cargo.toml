[package]
name = "ferryx-remote-helper"
version = "2026.908.1"
description = "Standalone SSH remote PTY daemon for Ferryx"
authors = ["Ferryx Contributors"]
edition = "2021"

[[bin]]
name = "ferryx-remote-helper"
path = "../src-tauri/src/ferryx_scope/ssh/standalone.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portable-pty = "0.9"
uuid = { version = "1.26", features = ["v4"] }
rand = "0.8"
libc = "0.2"
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[dev-dependencies]
tempfile = "3.17"

