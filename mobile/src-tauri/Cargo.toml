[package]
name = "ferryx-mobile"
version = "1.0.0"
edition = "2021"
rust-version = "1.90"
license-file = "../../LICENSE"

[lib]
name = "ferryx_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-opener = "=2.7.2"

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSError", "NSObject"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "block2", "UIActivity", "UIActivityViewController", "UIViewController", "UIResponder"] }
