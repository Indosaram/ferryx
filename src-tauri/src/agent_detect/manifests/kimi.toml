# Ported from herdr on 2026-08-28.
# Source manifest id "kimi"; extracted byte-accurately from the embedded corpus.
id = "kimi"
display_name = "Kimi"
homepage = "https://github.com/MoonshotAI/kimi-cli"
version = "2026.06.10.1"
min_engine_version = 1
updated_at = "2026-06-10T00:00:00Z"
aliases = ["kimi-code", "kimi code"]

[[rules]]
id = "current_approval_panel"
state = "blocked"
priority = 400
region = "whole_recent"
visible_blocker = true
contains = ["↵ confirm"]
any = [
  { contains = ["run this command?"] },
  { contains = ["write this file?"] },
  { contains = ["apply these edits?"] },
  { contains = ["stop this task?"] },
  { contains = ["ready to build with this plan?"] },
  { line_regex = ['(?i)^\s*▶?\s*approve .*\?$'] },
]
all = [
  { contains = [" choose"] },
  { any = [{ contains = ["approve"] }, { contains = ["reject"] }, { contains = ["revise"] }] },
]

[[rules]]
id = "question_panel"
state = "blocked"
priority = 390
region = "whole_recent"
visible_blocker = true
contains = ["↑↓ select", "esc cancel"]
line_regex = ['^\s*question\s*$', '^\s*\? ']
any = [
  { contains = ["↵ choose"] },
  { contains = ["↵ toggle"] },
  { contains = ["↵ save"] },
]

[[rules]]
id = "legacy_approval_panel"
state = "blocked"
priority = 300
region = "whole_recent"
contains = ["requesting approval", "reject"]
any = [
  { contains = ["approve once"] },
  { contains = ["approve for this session"] },
]
all = [
  { any = [{ contains = ["1/2/3/4 choose"] }, { contains = ["↵ confirm"] }] },
]

[[rules]]
id = "background_agent_status_working"
state = "working"
priority = 120
region = "bottom_non_empty_lines(3)"
visible_working = true
line_regex = ['(?i)\bkimi[-\w.]*\s+thinking\b.*\[[1-9][0-9]*\s+agents?\s+running\]']

[[rules]]
id = "moon_spinner_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
line_regex = ['^\s*(🌕|🌖|🌗|🌘|🌑|🌒|🌓|🌔)\s*$']

[[rules]]
id = "braille_spinner_working"
state = "working"
priority = 90
region = "whole_recent"
visible_working = true
line_regex = ['(?i)^\s*[\u2800-\u28FF]+\s*(thinking\.\.\.|working\.\.\.|using )']
# cline's working row " ⠏ Thinking... (esc to cancel)" (screens/cline/working.screen).
not = [{ line_regex = ['\(esc to cancel\)\s*$'] }]

# Kimi Code CLI (measured 2026-10-22, .omo-parity/facts/screens/kimi/): between
# turns the bottom row is the status bar "16:12  agent (kimi-for-coding, thinking)
# ... context: 0.0%"; during a turn it shrinks to "context: 0.0%" under the moon
# spinner, so the clock + mode prefix only shows while idle.

[[rules]]
id = "status_bar_idle"
state = "idle"
priority = 60
region = "bottom_non_empty_lines(1)"
visible_idle = true
line_regex = ['^\s*\d{1,2}:\d{2}\s+agent \(.*\).*\scontext: \d+(?:\.\d+)?%\s*$']
