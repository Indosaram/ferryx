id = "opencode"
version = "2026.08.27.1"
min_engine_version = 1
aliases = ["open-code", "herdr:opencode"]

[[rules]]
id = "permission_required"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
  { contains = ["Permission required"] },
  { contains = ["esc dismiss"], any = [{ contains = ["enter confirm"] }, { contains = ["enter submit"] }, { contains = ["enter toggle"] }] },
]

# Measured 2026-10-22 (opencode 1.18.18, .omo-parity/facts/screens/opencode/*approval*):
# "△ Permission required" above the "Allow once   Allow always   Reject" buttons. The broad
# permission_required stays at 300 because crush's "Permission Required" dialog matches it
# case-insensitively; this anchored rule outranks omo approval_footer_blocked (400).
[[rules]]
id = "permission_buttons_blocked"
state = "blocked"
priority = 420
region = "whole_recent"
visible_blocker = true
line_regex = [
  '△ Permission required',
  'Allow once\s+Allow always\s+Reject',
]

# Measured 2026-10-22 (opencode/{working,lc-working,local1-working}.screen): while a turn runs
# the bottom line is the progress bar "■■■■■⬝⬝⬝  esc interrupt ... ctrl+p commands".
[[rules]]
id = "progress_bar_working"
state = "working"
priority = 210
region = "bottom_non_empty_lines(1)"
visible_working = true
line_regex = ['^\s*[■⬝]+\s+esc interrupt\b']

[[rules]]
id = "interrupt_hint_working"
state = "working"
priority = 110
region = "whole_recent"
visible_working = true
any = [
  { contains = ["esc to interrupt"] },
  { contains = ["ctrl+c to interrupt"] },
  { contains = ["press esc to interrupt"] },
  { line_regex = ['(?i).*opencode.*esc (again to )?interrupt'] },
]

[[rules]]
id = "opencode_prompt_idle"
state = "idle"
priority = 70
# 4 lines: on the welcome screen (opencode/idle.screen) the cwd footer wraps onto a second
# line under the "tab agents  ctrl+p commands" hint.
region = "bottom_non_empty_lines(4)"
visible_idle = true
any = [
  { contains = ["Ask anything"] },
  { contains = ["ctrl+p commands"] },
]
not = [
  { contains = ["esc to interrupt"] },
  { contains = ["esc interrupt"] },
  { contains = ["Permission required"] },
]
