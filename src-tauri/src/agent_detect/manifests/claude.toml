id = "claude"
display_name = "Claude Code"
homepage = "https://www.anthropic.com/claude-code"
version = "2026.08.27.1"
min_engine_version = 1
aliases = ["claude-code"]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1100
region = "osc_title"
visible_working = true
regex = ['^[\x{2800}-\x{28FF}\x{25D0}-\x{25D3}] ']

[[rules]]
id = "transcript_viewer"
state = "unknown"
priority = 1000
region = "bottom_non_empty_lines(3)"
skip_state_update = true
contains = ["showing detailed transcript"]
any = [
  { contains = ["ctrl+o", "to toggle"] },
  { contains = ["ctrl+e", "show all"] },
  { contains = ["ctrl+e", "collapse"] },
  { contains = ["? for shortcuts"] },
]

[[rules]]
id = "dynamic_workflow_prompt"
state = "blocked"
priority = 980
region = "whole_recent"
visible_blocker = true
contains = ["run a dynamic workflow?", "esc to cancel"]

[[rules]]
id = "btw_overlay_working"
state = "working"
priority = 975
region = "bottom_non_empty_lines(5)"
visible_working = true
line_regex = [
  '^\s*/btw(?:\s|$)',
  '(?i)esc to close\s*$',
]

[[rules]]
id = "bash_permission_prompt"
state = "blocked"
priority = 850
region = "whole_recent"
visible_blocker = true
contains = ["do you want to proceed?"]
any = [
  { contains = ["bash command"] },
  { contains = ["bash("] },
  { contains = ["contains expansion"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
]
all = [
  { any = [{ line_regex = ['(?i)^\s*yes\b'] }, { line_regex = ['(?i)^\s*1\.\s*yes\b'] }, { line_regex = ['(?i)^\s*2\.\s*no\b'] }] },
]

[[rules]]
id = "generic_permission_prompt"
state = "blocked"
priority = 840
region = "whole_recent"
visible_blocker = true
contains = ["do you want to proceed?", "esc to cancel"]
all = [
  { any = [
    { line_regex = ['(?i)^\s*1\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*2\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*2\.\s*no\b'] },
    { line_regex = ['(?i)^\s*3\.\s*no\b'] },
  ] },
]

# Measured 2026-10-22 (claude 2.1.296/2.1.308, .omo-parity/facts/screens/claude/). While a
# turn runs, the mode footer under the composer gains "esc to interrupt"
# ("⏸ manual mode on · esc to interrupt · ← for agents", local1-working.screen;
# "⏵⏵ auto mode on (shift+tab to cycle) · esc to interrupt · ← for agents", lc-working.screen).
# Priority 210 beats omo esc_cancel_working (150) and omo spinner_working (200).
[[rules]]
id = "mode_footer_working"
state = "working"
priority = 210
region = "bottom_non_empty_lines(1)"
visible_working = true
line_regex = ['^\s*(?:⏵⏵|⏸)\s+(?:auto|manual) mode on\b.*·\s*esc to interrupt\b']

# Between turns the same footer has no "esc to interrupt" and sits under the "❯" composer
# framed by two full-width rules (idle, after-turn-idle, done, resumed captures).
[[rules]]
id = "mode_footer_idle"
state = "idle"
priority = 100
region = "bottom_non_empty_lines(4)"
visible_idle = true
line_regex = [
  '^\s*(?:⏵⏵|⏸)\s+(?:auto|manual) mode on\b',
  '^❯',
  '^─{20,}\s*$',
]
not = [{ contains = ["esc to interrupt"] }]

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 250
region = "osc_title"
visible_idle = true
regex = ['^\x{2733} ']
