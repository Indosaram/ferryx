# Ported from herdr on 2026-08-28.
# Source manifest id "copilot"; extracted byte-accurately from the embedded corpus.
id = "copilot"
version = "2026.07.07.1"
min_engine_version = 1
updated_at = "2026-07-07T14:15:00Z"
aliases = ["github-copilot", "ghcs"]

[[rules]]
id = "selection_blocker"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
all = [
  { any = [
    { contains = ["suggested edits"] },
    { contains = ["copilot"] },
  ] },
  { any = [
    { contains = ["esc to cancel"] },
    { contains = ["esc cancel"] },
  ] },
  { any = [
    { contains = ["enter to select"] },
    { contains = ["enter to confirm"] },
    { contains = ["enter to submit"] },
    { contains = ["enter accept"] },
  ] },
]

# Added 2026-08-28 from a REAL capture of GitHub Copilot CLI 0.0.375 (see
# docs/evidence/agent-screen-rules/). That build's confirmation footer reads
# "Confirm with number keys or ↑↓ keys and Enter, Cancel with Esc", which matches
# none of herdr's ported terms above, so the ported rules alone miss it.
# Both substrings are required (contains is AND), keeping it safe under global evaluation.
[[rules]]
id = "numeric_confirm_footer_blocked"
state = "blocked"
priority = 310
region = "whole_recent"
visible_blocker = true
contains = ["confirm with number keys", "cancel with esc"]

[[rules]]
id = "working_cancel_hint"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
# Generic "esc to cancel" / "esc cancel" / "esc interrupt" match any interactive shell/CLI/fzf.
# Copilot CLI generation cancel requires "esc again to cancel".
contains = ["esc again to cancel"]

# Measured 2026-10-22 (Copilot CLI 0.0.375, .omo-parity/facts/screens/copilot/). While a turn
# runs a status row "∙ Thinking (Esc to cancel)" / "◎ Thinking (Esc to cancel)" /
# "◉ Thinking (Esc to cancel)" sits above the cwd line and the composer box, whose footer
# reads "Ctrl+c Exit · Ctrl+r Expand recent".
[[rules]]
id = "thinking_row_working"
state = "working"
priority = 105
region = "bottom_non_empty_lines(7)"
visible_working = true
contains = ["ctrl+c exit · ctrl+r expand recent"]
line_regex = ['^\s*[∙◎◉]\s+\S.*\(Esc to cancel\)\s*$']

# The composer ">  Enter @ to mention files or / for commands" framed by two rules, above
# the "Ctrl+c Exit · Ctrl+r Expand recent" footer (idle, after-turn, resumed captures).
# The working row above it outranks this rule.
[[rules]]
id = "composer_idle"
state = "idle"
priority = 85
region = "bottom_non_empty_lines(4)"
visible_idle = true
contains = ["enter @ to mention files or / for commands"]
line_regex = ['^\s*Ctrl\+c Exit · Ctrl\+r Expand recent']
