[package]
name = "ferryx"
version = "0.1.0"
description = "Ultra-lightweight workspace & AI agent launcher (Tauri v2 + Rust)"
authors = ["Ferryx Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ferryx/ferryx"
homepage = "https://ferryx.app"
edition = "2021"
default-run = "ferryx"

[lib]
name = "ferryx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ferryx"
path = "src/main.rs"

[[bin]]
name = "native_terminal_renderer_poc"
path = "src/bin/native_terminal_renderer_poc.rs"
required-features = ["native-terminal"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["native-terminal"]
native-terminal = [
    "dep:wgpu",
    "dep:raw-window-handle",
    "dep:winit",
    "dep:png",
    "dep:bytemuck",
    "dep:pollster",
    "dep:fontdb",
    "dep:ab_glyph",
]

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "test", "unstable"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
portable-pty = "0.8"
base64 = "0.22"
libc = "0.2"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
uuid = { version = "1.13", features = ["v4"] }
axum = { version = "0.8", features = ["ws"] }
mime_guess = "2.0"
tower-http = { version = "0.6", features = ["cors", "trace"] }
rand = "0.8"
sha2 = "0.10"
futures-util = "0.3"
cookie = "0.18"
time = "0.3"
wgpu = { version = "24", optional = true }
raw-window-handle = { version = "0.6", optional = true }
winit = { version = "0.30", optional = true }
png = { version = "0.17", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
rodio = { version = "0.22", default-features = false, features = [
    "playback",
    "wav",
    "mp3",
    "flac",
    "vorbis",
    "mp4",
] }
fontdb = { version = "0.16", optional = true }
ab_glyph = { version = "0.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSEvent",
    "NSApplication",
    "NSDockTile",
    "NSView",
    "NSWindow",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSBundle",
    "NSError",
    "NSString",
    "NSGeometry",
    "NSObject",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKWebView", "WKNavigation"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNUserNotificationCenter",
    "UNNotificationSettings",
] }
dispatch2 = "0.3"
block2 = "0.6"

[dev-dependencies]
tempfile = "3.17"
tokio-test = "0.4"
