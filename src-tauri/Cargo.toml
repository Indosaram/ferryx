[package]
name = "ferryx"
version = "0.1.0"
description = "Ultra-lightweight workspace & AI agent launcher (Tauri v2 + Rust)"
authors = ["Ferryx Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ferryx/ferryx"
homepage = "https://ferryx.app"
edition = "2021"

[lib]
name = "ferryx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ferryx"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["test", "unstable"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
portable-pty = "0.8"
base64 = "0.22"
libc = "0.2"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
uuid = { version = "1.13", features = ["v4"] }
axum = { version = "0.8", features = ["ws"] }
mime_guess = "2.0"
tower-http = { version = "0.6", features = ["cors", "trace"] }
rand = "0.8"
sha2 = "0.10"
futures-util = "0.3"
cookie = "0.18"
time = "0.3"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
rodio = { version = "0.22", default-features = false, features = [
    "playback",
    "wav",
    "mp3",
    "flac",
    "vorbis",
    "mp4",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSEvent",
    "NSApplication",
    "NSDockTile",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSBundle",
    "NSError",
    "NSString",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKWebView", "WKNavigation"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNUserNotificationCenter",
    "UNNotificationSettings",
] }
block2 = "0.6"

[dev-dependencies]
tempfile = "3.17"
tokio-test = "0.4"
