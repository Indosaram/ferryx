[package]
name = "orca-lite"
version = "0.1.0"
description = "Ultra-lightweight workspace & AI agent launcher (Tauri v2 + Rust)"
edition = "2021"

[lib]
name = "orca_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "orca-lite"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["test"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
portable-pty = "0.8"
base64 = "0.22"
libc = "0.2"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
uuid = { version = "1.13", features = ["v4"] }

[dev-dependencies]
tempfile = "3.17"
tokio-test = "0.4"
