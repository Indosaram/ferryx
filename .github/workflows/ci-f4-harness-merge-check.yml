name: Harness merge check

# One-off: proves the merged check-summary coverage rules and their tests load and pass on a
# hosted runner after int and the UI-audit lane met in check-summary.mjs. Deleted before merge.
on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/f4-harness-merge-check'

permissions:
  contents: read

jobs:
  check-summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Test and exercise the merged coverage rules
        run: |
          set -euo pipefail
          bun test scripts/browser-qa/check-summary.test.mjs
          # A full summary missing a daily gap must fail, and a CDP summary with every required
          # check true must pass: exercise both through the real CLI, not only the unit tests.
          dir=$(mktemp -d)
          mkdir -p "$dir/full" "$dir/cdp"
          printf '%s\n' '{"scenario":"full","platform":"linux","engine":{"checks":{"installed_from_settings":true}},"extension":{"checks":{}},"daily":{"g1":{"checks":{"restored":true}}}}' > "$dir/full/summary.json"
          if bun scripts/browser-qa/check-summary.mjs "$dir/full"; then
            echo "a full summary missing its daily gaps must fail" >&2
            exit 1
          fi
          bun -e 'import { CDP_REQUIRED } from "./scripts/browser-qa/check-summary.mjs"; const s={scenario:"cdp",platform:"linux"}; for (const [k,v] of Object.entries(CDP_REQUIRED)) s[k]={checks:Object.fromEntries(v.map(n=>[n,true]))}; s.download.checks.disk_full_reported=true; s.import.checks.cookies_imported=true; await Bun.write(process.argv.at(-1), JSON.stringify(s));' "$dir/cdp/summary.json"
          bun scripts/browser-qa/check-summary.mjs "$dir/cdp"

