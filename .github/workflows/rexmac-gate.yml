name: rexmac-gate
on:
  push:
    branches: ['ci/rexmac']
jobs:
  gate:
    runs-on: macos-latest
    timeout-minutes: 170
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: gates
        shell: bash
        run: |
          mkdir -p out
          bash .github/rexmac-gate.sh "$PWD" 2>&1 | tee out/gate.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rexmac-gate
          path: out
