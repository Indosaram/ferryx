name: win-full-triage
on:
  push:
    branches: ['ci/win-full-triage-20261102']
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'
jobs:
  full:
    strategy:
      fail-fast: false
      matrix:
        rev: [749b26e8596149c8da55f036f3fc52d5cd1be3ff, 04a2048e]
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.rev }}
          submodules: recursive
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: env
        shell: bash
        run: |
          echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> "$GITHUB_ENV"
          git config --global user.name ferryx-ci
          git config --global user.email ferryx-ci@users.noreply.github.com
          git log --oneline -1
      - name: JS deps + UI build
        shell: bash
        run: |
          bun install --frozen-lockfile || bun install
          bun install --cwd ui --frozen-lockfile || bun install --cwd ui
          bun run --cwd ui build
          bun scripts/fetch-ffmpeg.mjs
      - name: Build
        timeout-minutes: 75
        shell: bash
        run: |
          cargo build --manifest-path remote-helper/Cargo.toml
          cargo nextest run --manifest-path src-tauri/Cargo.toml --lib --no-run
      - name: Full lib (nextest, per-test 120s kill)
        timeout-minutes: 80
        shell: bash
        run: |
          set +e
          mkdir -p src-tauri/.config
          printf '[profile.triage]\nslow-timeout = { period = "60s", terminate-after = 2 }\nfail-fast = false\ntest-threads = 4\nfinal-status-level = "none"\nstatus-level = "fail"\n' > src-tauri/.config/nextest.toml
          cargo nextest run --manifest-path src-tauri/Cargo.toml --lib --profile triage --no-fail-fast 2>&1 | tee nx.txt | grep -vE '^\s+PASS'
          echo "NX-RC ${PIPESTATUS[0]}"
          grep -E '^\s+(FAIL|TIMEOUT|SIGSEGV|SIGABRT|ABORT|LEAK)' nx.txt | sed 's/^/NX-RESULT ${{ matrix.rev }} /'
          exit 0
