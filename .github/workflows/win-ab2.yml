name: win-ab-machine
on:
  push:
    branches: ['ci/win-ab-machine-20261102']
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'
jobs:
  ab:
    strategy:
      fail-fast: false
      matrix:
        rev: [749b26e8596149c8da55f036f3fc52d5cd1be3ff, 04a2048ef0844f9c780f7728ac76f79a362c36ee]
    runs-on: windows-2022
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.rev }}
          submodules: recursive
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: env
        shell: bash
        run: |
          echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> "$GITHUB_ENV"
          git config --global user.name ferryx-ci
          git config --global user.email ferryx-ci@users.noreply.github.com
      - name: JS deps + UI build
        shell: bash
        run: |
          bun install --frozen-lockfile || bun install
          bun install --cwd ui --frozen-lockfile || bun install --cwd ui
          bun run --cwd ui build
          bun scripts/fetch-ffmpeg.mjs
      - name: Build
        timeout-minutes: 75
        shell: bash
        run: |
          cargo build --manifest-path remote-helper/Cargo.toml
          cargo nextest run --manifest-path src-tauri/Cargo.toml --lib --no-run
      - name: A/B (3 rounds each)
        timeout-minutes: 75
        shell: bash
        run: |
          set +e
          mkdir -p src-tauri/.config
          printf '[profile.ab]\nslow-timeout = { period = "60s", terminate-after = 2 }\nfail-fast = false\ntest-threads = 2\nstatus-level = "all"\nfinal-status-level = "none"\n' > src-tauri/.config/nextest.toml
          for round in 1 2 3; do
            for f in 'test(/^daemon::session_service::machine_tests::/)' 'test(/^remote::machine_operation_journal::contention_tests::/)'; do
              cargo nextest run --manifest-path src-tauri/Cargo.toml --lib --profile ab --no-fail-fast -E "$f" 2>&1 | tee o.txt | grep -E '^\s+(PASS|FAIL|TIMEOUT|SIGSEGV|ABORT)' | perl -ne 'print "AB2 '"${{ matrix.rev }}"' r'"$round"' $1 $2\n" if /^\s+(\S+) \[.*\) ferryx (\S+)/'
            done
          done
          exit 0
