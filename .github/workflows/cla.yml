name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# contents: write is barred by scripts/release-workflow-policy.mjs, so signatures live in a
# separate repository written with CLA_SIGNATURES_TOKEN (a fine-grained PAT scoped to that repo).
permissions:
  actions: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA signature
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          remote-organization-name: Indosaram
          remote-repository-name: ferryx-cla-signatures
          branch: main
          allowlist: Indosaram,dependabot[bot],github-actions[bot]
