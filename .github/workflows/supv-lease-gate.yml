name: supv-lease-gate
on:
  push:
    branches: ['ci/supvl-*']
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev jq
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: gates
        shell: bash
        run: |
          mkdir -p out
          git config --global user.email ci@ferryx.dev; git config --global user.name ci
          bash .github/supv-gate.sh "$PWD" 2>&1 | tee out/gate.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supv-gate
          path: out
