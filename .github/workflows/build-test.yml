name: CI Build & Check

# Phase 1 precheck: lint gates plus the Rust unit and integration suites, on a standard GitHub-hosted ARM64 macOS
# runner, plus a separate MCP declaration/dispatch contract gate. The ubuntu UI job and the
# Linux/Windows cargo legs are kept but run only on manual dispatch.
#
# A push to main does NOT start this workflow. Gates are pulled explicitly (`workflow_dispatch`)
# or on a pull request, so landing a merge never queues a 30-minute macOS matrix behind a CI
# queue that a previous main run is already occupying.
on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      legacy:
        description: 'Also run the legacy UI and Linux/Windows cargo legs'
        type: boolean
        default: false
      suite:
        description: 'Test scope: full (library plus integration) or integration only'
        type: choice
        options:
          - full
          - integration
        default: full

concurrency:
  group: ci-${{ github.ref }}
  # A newer push must not kill an in-flight main run: the macOS leg compiles for ~30 minutes
  # before the suites start, so cancelling mid-compilation produced a permanently
  # "cancelled" signal that looked like a failure. PR branches still supersede themselves.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # =========================================================================
  # 0. PHASE 1 PRECHECK: LINT + UNIT/INTEGRATION TESTS (GitHub-hosted macOS)
  # =========================================================================
  precheck:
    name: Lint, unit and integration tests (macOS)
    # Public repositories use this standard ARM64 runner without runner-minute charges.
    # Pin the OS; do not select a paid -xlarge runner or change the aarch64 target.
    runs-on: macos-15
    # Allow a full hour for single-job test compilation, in addition to setup and test execution.
    timeout-minutes: 110
    # Keep test compilation within the ephemeral runner's disk budget. Assertions remain on.
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      # audiopus_sys 0.2.2 bundles Opus with a CMake 3.1 policy declaration.
      # CMake 4 removed <3.5 compatibility; use its supported external policy floor
      # without patching vendored sources or disabling the voice feature/tests.
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - name: 'Checkout repository (submodules: recursive)'
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Fixture suites re-clone this checkout and resolve `HEAD~1`; a depth-1 checkout leaves
          # a single commit, so git parses the argument as a path and the fixture dies with
          # "fatal: git checkout: --detach does not take a path argument 'HEAD~1'".
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: macos-15-tests-no-debuginfo-v1
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Report disk space before compilation
        run: df -h . "$RUNNER_TEMP"

      # Fixture suites commit through git. A fresh runner ships no global identity, so
      # `git commit` inside a fixture repository fails before the assertion under test runs.
      - name: Configure git identity for fixture repositories
        shell: bash
        run: |
          git config --global user.name "ferryx-ci"
          git config --global user.email "ferryx-ci@users.noreply.github.com"
          git config --global init.defaultBranch main

      # The rollout rehearsal and the worktree fixtures create temporary repositories under
      # TMPDIR and assert it is set (`isolated TMPDIR`), because a temp repository inside the
      # checkout is re-owned by git's ceiling rules.
      - name: Isolate TMPDIR for fixture repositories
        shell: bash
        run: |
          ISOLATED_TMPDIR="${RUNNER_TEMP}/ferryx-ci-tmp"
          mkdir -p "$ISOLATED_TMPDIR"
          echo "TMPDIR=$ISOLATED_TMPDIR" >> "$GITHUB_ENV"
          echo "GIT_CEILING_DIRECTORIES=$ISOLATED_TMPDIR" >> "$GITHUB_ENV"

      - name: Install Node/Bun dependencies
        run: |
          bun install --frozen-lockfile || bun install
          bun install --cwd ui --frozen-lockfile || bun install --cwd ui

      - name: Build Frontend UI (required for Tauri asset embed)
        run: bun run --cwd ui build

      # Include test fixtures and real local-socket contracts in every PR, not only
      # the manually dispatched legacy UI job. Network calls are mocked fail-closed.
      - name: Typecheck Frontend Tests
        run: bun run --cwd ui typecheck:test

      - name: Test Frontend UI
        run: bun run --cwd ui test

      # The ssh bridge and helper-setup suites execute the real helper binary: bridge_tests
      # asserts `remote-helper/target/debug/ferryx-remote-helper` exists before any assertion
      # runs, so without this step those tests fail on a missing file instead of on behaviour.
      - name: Build remote helper (debug, required by ssh bridge suites)
        run: cargo build --manifest-path remote-helper/Cargo.toml

      # The default remote-desktop feature links the pinned LGPL FFmpeg SDK that
      # .cargo/config.toml points FFMPEG_DIR at.
      - name: Fetch FFmpeg SDK (remote-desktop)
        run: bun scripts/fetch-ffmpeg.mjs --target aarch64-apple-darwin

      # ---- Lint gates ----
      - name: Verify release workflow policy
        run: bun scripts/release-workflow-policy.mjs

      # Backstop for the thread-ownership invariant: no GPU acquisition inside a
      # run_on_main_thread closure. The !Send tokens are the real enforcement, since a
      # lexical rule cannot follow a call into another function; this catches the direct
      # mistake. ast-grep comes from the @ast-grep/cli devDependency, not a system install.
      - name: Verify native terminal thread policy
        run: bun scripts/native-terminal-thread-policy.mjs

      # The gate must prove itself: this plants a violation, requires a non-zero exit, and
      # requires exit 0 on the clean tree. Without it a silently broken rule reports success.
      - name: Test native terminal thread policy gate
        run: bun test scripts/native-terminal-thread-policy.test.mjs

      # Multi-window invariant: production code never looks up the desktop window by the
      # literal "main" label; window_registry.rs resolves the caller, owner or focused window.
      - name: Verify multi-window policy
        run: bun scripts/multi-window-policy.mjs

      - name: Test multi-window policy gate
        run: bun test scripts/multi-window-policy.test.mjs

      # ---- Unit and integration suites ----
      - name: Test CI process supervision
        run: python3 -m unittest discover -s scripts -p 'ci_*_test.py'

      # Separate compilation from execution so a stuck test cannot hide the
      # completed compiler log. Both stages use precisely the same suite list.
      - name: Compile Rust test targets
        shell: bash
        timeout-minutes: 62
        env:
          TEST_SUITE: ${{ inputs.suite || 'full' }}
          CARGO_BUILD_TARGET: aarch64-apple-darwin
        run: python3 scripts/ci-run-bounded.py --timeout-seconds 3600 --log "$RUNNER_TEMP/ferryx-ci-logs/rust-compile.log" -- bash scripts/ci-native-tests.sh compile

      - name: Preserve successful native compilation if later tests fail
        # Keep the existing dependency cache scope; runtime fixture state is not cached.
        # Set only after the full selected target set compiled successfully.
        run: echo "CACHE_ON_FAILURE=true" >> "$GITHUB_ENV"

      - name: Cargo Test (unit and integration suites)
        shell: bash
        timeout-minutes: 32
        env:
          TEST_SUITE: ${{ inputs.suite || 'full' }}
          CARGO_BUILD_TARGET: aarch64-apple-darwin
        run: python3 scripts/ci-run-bounded.py --timeout-seconds 1800 --log "$RUNNER_TEMP/ferryx-ci-logs/rust-tests.log" -- bash scripts/ci-native-tests.sh run

      # The relay end-to-end suites (a real in-process relay and the E2E attach handshake) must
      # all run: an ignored, filtered, empty or missing suite fails this step instead of passing.
      - name: Relay E2E gate (no skips)
        shell: bash
        timeout-minutes: 22
        env:
          CARGO_BUILD_TARGET: aarch64-apple-darwin
        run: python3 scripts/ci-run-bounded.py --timeout-seconds 1200 --log "$RUNNER_TEMP/ferryx-ci-logs/relay-e2e.log" -- python3 scripts/ci-relay-e2e-gate.py

      # The remote grid mirror spans Rust and TypeScript: this asserts real serialized backend
      # frames parse in the actual frontend parser. It lives here, not in the UI job, because it
      # needs the Rust toolchain and the Ghostty submodule.
      - name: Remote Grid Frame Seam (Rust -> TypeScript)
        # Reuse the explicit-target native test artifacts instead of rebuilding host crates.
        env:
          CARGO_BUILD_TARGET: aarch64-apple-darwin
        timeout-minutes: 7
        run: python3 scripts/ci-run-bounded.py --timeout-seconds 300 --log "$RUNNER_TEMP/ferryx-ci-logs/grid-seam.log" -- bun run --cwd ui src/remote/gridFrameSeam.check.ts

      - name: Preserve native stage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-stage-logs
          path: ${{ runner.temp }}/ferryx-ci-logs/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report final disk usage
        if: always()
        run: |
          df -h . "$RUNNER_TEMP"
          for directory in src-tauri/target remote-helper/target; do
            if [ -d "$directory" ]; then du -sh "$directory"; fi
          done

  # These leaf-crate suites pin MCP tool declarations to their dispatch arms separately
  # from src-tauri tests: a declaration without an arm produces "unknown tool" in production.
  mcp-contract:
    name: MCP declaration and dispatch contracts (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - name: 'Checkout repository (submodules: recursive)'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./crates/ferryx-hub -> target
            ./crates/ferryx-rd -> target
          shared-key: macos-mcp-contract-no-debuginfo-v1
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # ferryx-rd-app's default features use the pinned SDK at .cargo/config.toml's FFMPEG_DIR.
      - name: Fetch FFmpeg SDK (remote-desktop)
        run: bun scripts/fetch-ffmpeg.mjs --target aarch64-apple-darwin

      - name: Test hub MCP declaration and dispatch contracts
        run: cargo test --manifest-path crates/ferryx-hub/Cargo.toml --lib 'mcp::'

      - name: Test remote-desktop MCP dispatch contracts
        # Report both suites even when the hub contract fails; either failure keeps the job red.
        if: ${{ success() || failure() }}
        # The leaf test binary has no Tauri build script to add the SDK's runtime search path.
        env:
          DYLD_FALLBACK_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/resources/ffmpeg/sdk/lib
        run: cargo test --manifest-path crates/ferryx-rd/ferryx-rd-app/Cargo.toml --features agent --lib dispatch_contract

  # =========================================================================
  # LEGACY MATRIX: MANUAL DISPATCH ONLY
  # The ubuntu UI job and the Linux/Windows cargo legs stay available for an explicit
  # workflow_dispatch run; they are not part of the phase 1 pull-request precheck.
  # =========================================================================
  # =========================================================================
  # 1. FRONTEND UI VALIDATION
  # =========================================================================
  ui-check:
    name: UI Build & Typecheck
    # Pinned rather than ubuntu-latest: on 2026-11-18 the floating label resolved to
    # ubuntu26.04 and the Playwright install step died with
    #   Cannot install dependencies for ubuntu26.04-x64 with Playwright 1.55.1!
    #   ERROR: Playwright does not support ffmpeg on ubuntu26.04-x64
    # which is an image gap, not a defect in this repository. The steps below need a
    # Playwright-supported Ubuntu, so the label is stated instead of inherited.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Release and packaging contract tests inspect git history; a depth-1 checkout makes
          # `HEAD~1` unresolvable and turns those contracts into false failures.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The release provenance contracts generate, sign and verify a real checksum signature. They
      # are the only check that the published SHA256SUMS is actually signed, so they must run here
      # rather than be skipped: install the signer instead of letting it surface as six failures.
      - name: Install minisign (release provenance contracts)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile || bun install
          bun install --cwd ui --frozen-lockfile || bun install --cwd ui
          bun install --cwd site --frozen-lockfile || bun install --cwd site

      - name: Verify release workflow policy
        run: bun scripts/release-workflow-policy.mjs

      # Backstop for the thread-ownership invariant: no GPU acquisition inside a
      # run_on_main_thread closure. The !Send tokens are the real enforcement, since a
      # lexical rule cannot follow a call into another function; this catches the direct
      # mistake. ast-grep comes from the @ast-grep/cli devDependency, not a system install.
      - name: Verify native terminal thread policy
        run: bun scripts/native-terminal-thread-policy.mjs

      # The gate must prove itself: this plants a violation, requires a non-zero exit, and
      # requires exit 0 on the clean tree. Without it a silently broken rule reports success.
      - name: Test native terminal thread policy gate
        run: bun test scripts/native-terminal-thread-policy.test.mjs

      - name: Build Frontend UI
        run: bun run --cwd ui build

      - name: Test Frontend UI
        run: bun run --cwd ui test

      # The navbar geometry suite drives a real Chrome, and playwright is not a declared
      # dependency of this workspace (site/ imports it from ui/node_modules when present).
      # Install it into a scratch prefix and point the probe at that module, so the gate runs
      # the real layout measurement instead of failing on an unresolvable import.
      - name: Install Playwright Chrome for landing-site geometry
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          printf '{ "name": "pw-scratch", "private": true }\n' > package.json
          bun add playwright@1.55.1
          bunx playwright install --with-deps chrome
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"

      - name: Test Landing Site
        run: bun test --cwd site

      # These packaging and release script tests were previously never executed in CI. The
      # suite spawns real child processes, so it needs a per-test bound and a step bound: on
      # 2026-11-05 this step sat in_progress for over three hours with no output, and a step
      # that never returns reports nothing about which test is stuck.
      #
      # The six excluded files are Vitest suites (they import from "vitest"); Bun collects them
      # because they sit under scripts/qa, runs the assertions that happen to be Bun-compatible,
      # and then never exits once they are done. They belong to
      # scripts/qa/recovery-continuation-vitest.config.mjs, which no gate invokes yet; running
      # them here produced a silent hang, not a verdict. Excluding them keeps this step honest
      # about what it covers instead of letting a stuck file hide the other 69.
      - name: Test Release and Packaging Scripts
        timeout-minutes: 20
        run: |
          bun test scripts/ \
            --path-ignore-patterns '**/fixture-pty-child.contract.test.mjs' \
            --path-ignore-patterns '**/native-configured-adapters.contract.test.mjs' \
            --path-ignore-patterns '**/native-forwarding-transport.contract.test.mjs' \
            --path-ignore-patterns '**/session-recovery-consistency.test.mjs' \
            --path-ignore-patterns '**/session-recovery-native.contract.test.mjs' \
            --path-ignore-patterns '**/session-recovery-provisioned.test.mjs' \
            --timeout 60000

  # =========================================================================
  # 2. RUST BACKEND VALIDATION ACROSS PLATFORMS
  # =========================================================================
  rust-check:
    name: Rust Check (${{ matrix.os_name }})
    runs-on: ${{ matrix.platform }}
    # Same CMake 4 policy floor as the precheck job: audiopus_sys 0.2.2 bundles Opus with a
    # CMake 3.1 policy declaration, which current macOS and Windows runner images reject.
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      # Linking this crate on a hosted Windows runner exhausted the paging file:
      #   failed to mmap libferryx_lib.rlib: The paging file is too small
      # which surfaced as E0786 "invalid metadata files". One codegen unit at a time plus
      # no debuginfo keeps peak commit under the runner's memory budget, matching precheck.
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os_name: 'macos'
            target: 'aarch64-apple-darwin'
          - platform: 'windows-latest'
            os_name: 'windows'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'ubuntu-latest'
            os_name: 'linux'
            target: 'x86_64-unknown-linux-gnu'

    steps:
      - name: 'Checkout repository (submodules: recursive)'
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Fixture suites re-clone this checkout and resolve `HEAD~1`; a depth-1 checkout leaves
          # a single commit, so git parses the argument as a path and the fixture dies with
          # "fatal: git checkout: --detach does not take a path argument 'HEAD~1'".
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false

      - name: Install Linux system dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            clang \
            libclang-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libdbus-1-dev \
            libva-dev \
            libdrm-dev \
            libgbm-dev \
            libegl-dev \
            libgl-dev \
            libxcb1-dev \
            libxcb-shm0-dev \
            libxcb-randr0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxfixes-dev \
            libxtst-dev \
            libxi-dev \
            libevdev-dev \
            libudev-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Shared sccache over the 6379 endpoint. The server enforces `requirepass`, so an
      # open port alone cannot read or poison the cache. Fork PRs receive no secrets and
      # simply compile without the shared cache: the step exits 0 without wiring the wrapper.
      - name: Configure sccache
        shell: bash
        env:
          SCCACHE_PASSWORD: ${{ secrets.SCCACHE_REDIS_PASSWORD }}
          SCCACHE_HOST: ${{ vars.SCCACHE_REDIS_HOST || '1.231.34.236' }}
        run: |
          set -eu
          if [ -z "${SCCACHE_PASSWORD:-}" ]; then
            echo "sccache: no password secret available (fork PR); compiling without shared cache"
            exit 0
          fi
          V=0.10.0
          case "${{ runner.os }}" in
            Linux)
              curl -fsSL "https://github.com/mozilla/sccache/releases/download/v${V}/sccache-v${V}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C /tmp
              BIN="/tmp/sccache-v${V}-x86_64-unknown-linux-musl/sccache"
              ;;
            Windows)
              # Git Bash resolves a leading /tmp to <drive>:/tmp, which does not exist on the
              # runner and made rustc fail with "The system cannot find the path specified".
              # $RUNNER_TEMP is a real Windows path that both bash and rustc agree on.
              curl -fsSL -o "$RUNNER_TEMP/sccache.zip" "https://github.com/mozilla/sccache/releases/download/v${V}/sccache-v${V}-x86_64-pc-windows-msvc.zip"
              unzip -q -o "$RUNNER_TEMP/sccache.zip" -d "$RUNNER_TEMP"
              BIN=$(find "$RUNNER_TEMP" -name sccache.exe -type f | head -1)
              ;;
            *)
              echo "sccache: not wired for ${{ runner.os }}"
              exit 0
              ;;
          esac
          # RUSTC_WRAPPER must be a path rustc itself can execute. bash-style paths are not
          # portable across Git Bash and rustc, so normalise through cygpath when available.
          if command -v cygpath >/dev/null 2>&1; then BIN=$(cygpath -w "$BIN"); fi
          chmod +x "$BIN" 2>/dev/null || true
          [ -x "$BIN" ] || { echo "sccache: binary missing, skipping"; exit 0; }
          RUSTC=$(rustup which rustc)
          export SCCACHE_REDIS="redis://:${SCCACHE_PASSWORD}@${SCCACHE_HOST}:6379"
          export SCCACHE_IDLE_TIMEOUT=0
          if ! "$BIN" "$RUSTC" -vV >/dev/null 2>&1; then
            echo "::warning::sccache could not run rustc; compiling without the shared cache"
            exit 0
          fi
          {
            echo "RUSTC_WRAPPER=$BIN"
            echo "SCCACHE_REDIS=$SCCACHE_REDIS"
            echo "SCCACHE_IDLE_TIMEOUT=$SCCACHE_IDLE_TIMEOUT"
          } >> "$GITHUB_ENV"

      # Fixture suites commit through git. Hosted runners ship no global identity, so
      # `git commit` inside a fixture repository fails before the assertion under test runs.
      - name: Configure git identity for fixture repositories
        shell: bash
        run: |
          git config --global user.name "ferryx-ci"
          git config --global user.email "ferryx-ci@users.noreply.github.com"
          git config --global init.defaultBranch main

      # The rollout rehearsal and the worktree fixtures create temporary repositories under
      # TMPDIR and assert it is set (`isolated TMPDIR`), because a temp repository inside the
      # checkout is re-owned by git's ceiling rules. Hosted Linux runners ship no TMPDIR.
      - name: Isolate TMPDIR for fixture repositories
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          ISOLATED_TMPDIR="${RUNNER_TEMP}/ferryx-ci-tmp"
          mkdir -p "$ISOLATED_TMPDIR"
          echo "TMPDIR=$ISOLATED_TMPDIR" >> "$GITHUB_ENV"
          echo "GIT_CEILING_DIRECTORIES=$ISOLATED_TMPDIR" >> "$GITHUB_ENV"

      - name: Install Node/Bun dependencies
        run: |
          bun install --frozen-lockfile || bun install
          bun install --cwd ui --frozen-lockfile || bun install --cwd ui

      - name: Build Frontend UI (required for Tauri asset embed)
        run: bun run --cwd ui build

      # The default remote-desktop feature links the pinned LGPL FFmpeg SDK. Kept out of the cargo
      # steps so they stay on the default shell (Windows: pwsh with Strawberry Perl, which the
      # vendored OpenSSL build needs; Git Bash's perl lacks its modules).
      - name: Fetch FFmpeg SDK (remote-desktop)
        run: bun scripts/fetch-ffmpeg.mjs --target ${{ matrix.target }}

      - name: Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      # cargo check does not invoke link.exe, so it cannot catch mismatched Ghostty static and
      # import library directives. Link the Windows binary before allowing a release-tag PR through.
      - name: Cargo Link (Windows)
        if: matrix.os_name == 'windows'
        run: cargo build --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      # Owned filesystem/config contracts only: no daemon, GPU or user-profile mutation.
      # Expand this list only after the domain-specific isolation repairs are verified.
      - name: Cargo Test (Windows isolated contracts)
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            --target ${{ matrix.target }} \
            --test windows_edge_probe_contract \
            --test windows_window_opacity_contract \
            --test q4_windows_paths \
            -- --test-threads=1

      # q4_windows_paths above is the only end-to-end check that Git's worktree inventory and
      # WorktreeManager agree on Windows path identity. The step below executes the Windows-only
      # lib code no other job runs - above all the job-object containment in worktree/git/windows.rs,
      # which cargo check can only type-check. The worktree filter keeps the POSIX-only unit tests
      # that share the same test binary from running on this runner. daemon::server::
      # agent_state_transport_tests is named explicitly beside it: its tests carry no unix cfg, so
      # this is the only job that compiles and runs them. They cover the non-unix agent-state ingress
      # module's contracts - the rendezvous record shape, token matching, the publish/readiness
      # ordering and the endpoint invariant - not the ingress path itself: nothing here drives the
      # non-unix spawn_agent_state_listener accept loop that publishes agent-state.rendezvous.
      # The `worktree` name filter sweeps in remote::workspace_api::worktrees::authority_tests,
      # which drive the owner wire over a Unix-socket transport: on non-unix the daemon requires a
      # transport token (`#[cfg(not(unix))] transport_authenticated`) that those fixtures never
      # publish, because unix authenticates by socket ownership instead. They fail before their
      # assertions run (TRANSPORT_UNAUTHORIZED), so they are skipped here and tracked as a gap in
      # Windows coverage of the machine transport rather than reported as a product failure.
      # The test executable loads the SDK's avcodec/avformat/avutil/swscale DLLs at startup, and a
      # hosted runner's PATH does not contain them: the binary died with 0xc0000135
      # (STATUS_DLL_NOT_FOUND) before a single test ran. The linked import libraries come from this
      # same SDK, so the DLLs are the matching pair, not a stray system copy.
      # Prepended through GITHUB_PATH rather than an `env:` entry: setting PATH there replaces the
      # whole variable for that step, which would drop cargo, bash and the rest of the runner
      # toolchain instead of only adding one directory.
      - name: Put the FFmpeg SDK DLLs on PATH (Windows)
        if: matrix.os_name == 'windows'
        shell: bash
        run: echo "$(cygpath -w "$GITHUB_WORKSPACE")/src-tauri/resources/ffmpeg/sdk/bin" >> "$GITHUB_PATH"

      - name: Cargo Test (Windows lib scope)
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            --target ${{ matrix.target }} \
            --lib \
            -- worktree \
            --test-threads=1 \
            --skip remote::workspace_api::worktrees::authority_tests::followthrough_delete_publication_blocks_spawn \
            --skip remote::workspace_api::worktrees::authority_tests::local_worktree_errors_survive_owner_wire_and_native_adapter \
            --skip remote::workspace_api::worktrees::authority_tests::owner_http_gate_and_eight_admissions
          cargo test --manifest-path src-tauri/Cargo.toml \
            --target ${{ matrix.target }} \
            --lib \
            -- daemon::server::agent_state_transport_tests \
            --test-threads=1

      # The ssh bridge and helper-setup suites execute the real helper binary: bridge_tests
      # asserts `remote-helper/target/debug/ferryx-remote-helper` exists before any assertion
      # runs, so without this step 15 bridge tests plus the upload-script test fail on a missing
      # file rather than on behaviour. The release pipeline stages helpers through
      # scripts/build-remote-helpers.mjs, but these suites only need the crate's debug build.
      - name: Build remote helper (debug, required by ssh bridge suites)
        if: matrix.os_name == 'linux'
        run: cargo build --manifest-path remote-helper/Cargo.toml

      # Suites that cannot run on a hosted runner, each skipped with the reason it was measured
      # to fail. They stay verified on real hosts: the gateway suites on a tailnet, the PTY
      # saturation suites on a real kernel buffer.
      # `--lib` is what pulls them in, so the exclusion has to be spelled out here.
      #   remote::tests::test_remote_server_health_and_lifecycle and
      #   remote::tests::test_headless_handover_workspace_state_...  require an active Tailscale
      #                                    IPv4 interface ("no active Tailscale IPv4 interface found").
      #   daemon::client::tests::test_client_workspace_registration_and_remote_apis
      #                                    requires a reachable relay ("Timed out waiting for
      #                                    relay registration ACK").
      #   terminal::tests::test_spawn_startup_command_omo
      #                                    requires the omo agent CLI on PATH.
      #   remote::server::machine_input_cancellation_tests::,
      #   remote::tests::security::sockets::a10_pending_machine_input_is_dropped_on_disconnect_and_revoke,
      #   terminal::tests::a_wedged_pty_does_not_block_the_async_runtime_thread
      #                                    assert the kernel's socket/PTY queue capacity (11776
      #                                    bytes on Linux) instead of the macOS buffer they were
      #                                    written against.
      #   ssh::direct::tests::failed_probe_distinguishes_non_utf8_and_empty_stderr
      #                                    asserts dash's literal `\xff` handling; it is a host-shell
      #                                    contract, not a product one.
      #   ssh::transport_unix::own_executable_tests::supervisor_program_survives_replacement_of_the_running_executable
      #                                    replaces the running executable, which the hosted image's
      #                                    mount does not permit.
      #   daemon::server::identity_admission_tests::
      #   daemon::session_service::machine_tests::
      #                                    assert behaviour of an installed mhc/omo pane owner, absent
      #                                    on a clean hosted image.
      - name: Cargo Test (host-dependent suites excluded)
        if: matrix.os_name == 'linux'
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            --target ${{ matrix.target }} \
            --lib \
            --test backend_hardening \
            --test daemon_persistence_contract \
            --test e2e_agent_workflow \
            --test ghostty_build_contract \
            --test ghostty_build_info_ffi \
            --test ipc_hardening_contract \
            --test native_terminal_capability_contract \
            --test native_terminal_child_surface_contract \
            --test native_terminal_composition_contract \
            --test native_terminal_engine_contract \
            --test native_terminal_input_boundary_contract \
            --test native_terminal_surface_host_contract \
            --test native_terminal_wayland_subsurface_contract \
            --test rorca_native_contract \
            --test session_persistence_integration \
            --test updater_config_contract \
            --test updater_endpoint_contract \
            --test worktree_safety \
            -- --test-threads=1 \
            --skip remote::tests::test_remote_server_health_and_lifecycle \
            --skip remote::tests::test_headless_handover_workspace_state_selects_live_session_without_desktop_selection \
            --skip daemon::client::tests::test_client_workspace_registration_and_remote_apis \
            --skip terminal::tests::test_spawn_startup_command_omo \
            --skip remote::server::machine_input_cancellation_tests:: \
            --skip remote::tests::security::sockets::a10_pending_machine_input_is_dropped_on_disconnect_and_revoke \
            --skip terminal::tests::a_wedged_pty_does_not_block_the_async_runtime_thread \
            --skip ssh::direct::tests::failed_probe_distinguishes_non_utf8_and_empty_stderr \
            --skip ssh::transport_unix::own_executable_tests::supervisor_program_survives_replacement_of_the_running_executable \
            --skip daemon::server::identity_admission_tests:: \
            --skip daemon::session_service::machine_tests::

      # The remote grid mirror spans Rust and TypeScript: this asserts real serialized
      # backend frames parse in the actual frontend parser. It lives here, not in the ui
      # job, because it needs the Rust toolchain and the Ghostty submodule.
      - name: Remote Grid Frame Seam (Rust -> TypeScript)
        if: matrix.os_name == 'linux'
        run: bun run --cwd ui src/remote/gridFrameSeam.check.ts
