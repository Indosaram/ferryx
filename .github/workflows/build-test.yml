name: CI Build & Check

# Phase 1 precheck: lint gates plus the Rust unit and integration suites, on a standard GitHub-hosted ARM64 macOS
# runner. Everything else in this file (the ubuntu UI job and the Linux/Windows cargo legs) is
# kept but runs only on manual dispatch, so a pull request gets one fast macOS job.
on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      legacy:
        description: 'Also run the legacy UI and Linux/Windows cargo legs'
        type: boolean
        default: false
      suite:
        description: 'Test scope: full (library plus integration) or integration only'
        type: choice
        options:
          - full
          - integration
        default: full

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 0. PHASE 1 PRECHECK: LINT + UNIT/INTEGRATION TESTS (GitHub-hosted macOS)
  # =========================================================================
  precheck:
    name: Lint, unit and integration tests (macOS)
    # Public repositories use this standard ARM64 runner without runner-minute charges.
    # Pin the OS; do not select a paid -xlarge runner or change the aarch64 target.
    runs-on: macos-15
    # A cold standard ARM64 run needs ~30 minutes just to compile the Rust test
    # targets, after ~10 minutes of setup/UI, before running the native suites.
    # Keep a bounded deadline without cancelling healthy cold builds mid-test.
    timeout-minutes: 90
    # Keep test compilation within the ephemeral runner's disk budget. Assertions remain on.
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      # audiopus_sys 0.2.2 bundles Opus with a CMake 3.1 policy declaration.
      # CMake 4 removed <3.5 compatibility; use its supported external policy floor
      # without patching vendored sources or disabling the voice feature/tests.
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - name: 'Checkout repository (submodules: recursive)'
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Fixture suites re-clone this checkout and resolve `HEAD~1`; a depth-1 checkout leaves
          # a single commit, so git parses the argument as a path and the fixture dies with
          # "fatal: git checkout: --detach does not take a path argument 'HEAD~1'".
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: macos-15-tests-no-debuginfo-v1

      - name: Report disk space before compilation
        run: df -h . "$RUNNER_TEMP"

      # Fixture suites commit through git. A fresh runner ships no global identity, so
      # `git commit` inside a fixture repository fails before the assertion under test runs.
      - name: Configure git identity for fixture repositories
        shell: bash
        run: |
          git config --global user.name "ferryx-ci"
          git config --global user.email "ferryx-ci@users.noreply.github.com"
          git config --global init.defaultBranch main

      # The rollout rehearsal and the worktree fixtures create temporary repositories under
      # TMPDIR and assert it is set (`isolated TMPDIR`), because a temp repository inside the
      # checkout is re-owned by git's ceiling rules.
      - name: Isolate TMPDIR for fixture repositories
        shell: bash
        run: |
          ISOLATED_TMPDIR="${RUNNER_TEMP}/ferryx-ci-tmp"
          mkdir -p "$ISOLATED_TMPDIR"
          echo "TMPDIR=$ISOLATED_TMPDIR" >> "$GITHUB_ENV"
          echo "GIT_CEILING_DIRECTORIES=$ISOLATED_TMPDIR" >> "$GITHUB_ENV"

      - name: Install Node/Bun dependencies
        run: |
          bun install --frozen-lockfile || bun install
          bun install --cwd ui --frozen-lockfile || bun install --cwd ui

      - name: Build Frontend UI (required for Tauri asset embed)
        run: bun run --cwd ui build

      # Include test fixtures and real local-socket contracts in every PR, not only
      # the manually dispatched legacy UI job. Network calls are mocked fail-closed.
      - name: Typecheck Frontend Tests
        run: bun run --cwd ui typecheck:test

      - name: Test Frontend UI
        run: bun run --cwd ui test

      # The ssh bridge and helper-setup suites execute the real helper binary: bridge_tests
      # asserts `remote-helper/target/debug/ferryx-remote-helper` exists before any assertion
      # runs, so without this step those tests fail on a missing file instead of on behaviour.
      - name: Build remote helper (debug, required by ssh bridge suites)
        run: cargo build --manifest-path remote-helper/Cargo.toml

      # The default remote-desktop feature links the pinned LGPL FFmpeg SDK that
      # .cargo/config.toml points FFMPEG_DIR at.
      - name: Fetch FFmpeg SDK (remote-desktop)
        run: bun scripts/fetch-ffmpeg.mjs --target aarch64-apple-darwin

      # ---- Lint gates ----
      - name: Verify release workflow policy
        run: bun scripts/release-workflow-policy.mjs

      # Backstop for the thread-ownership invariant: no GPU acquisition inside a
      # run_on_main_thread closure. The !Send tokens are the real enforcement, since a
      # lexical rule cannot follow a call into another function; this catches the direct
      # mistake. ast-grep comes from the @ast-grep/cli devDependency, not a system install.
      - name: Verify native terminal thread policy
        run: bun scripts/native-terminal-thread-policy.mjs

      # The gate must prove itself: this plants a violation, requires a non-zero exit, and
      # requires exit 0 on the clean tree. Without it a silently broken rule reports success.
      - name: Test native terminal thread policy gate
        run: bun test scripts/native-terminal-thread-policy.test.mjs

      # ---- Unit and integration suites ----
      # The P19 overlay gate suites bind a CGNAT overlay address, so the VM needs one that is
      # actually local. It must sit on a NON-loopback interface: the resolver enumerates
      # interfaces with IFF_UP and without IFF_LOOPBACK, so an lo0 alias is invisible to it.
      # Report the outcome here, so a missing capability shows up in this log instead of being
      # inferred from a test panic.
      - name: Provision overlay address for host-dependent suites
        shell: bash
        run: |
          OVERLAY_ADDRESS=100.64.1.2
          sudo -n true && echo "PROVISION sudo=available" || echo "PROVISION sudo=unavailable"
          ls -l /usr/sbin/sshd || echo "PROVISION sshd=missing"
          if ! ifconfig -a | grep -q "$OVERLAY_ADDRESS"; then
            for interface in $(ifconfig -l); do
              case "$interface" in lo*) continue ;; esac
              ifconfig "$interface" | grep -q 'inet ' || continue
              # macOS rejects a point-to-point alias without a netmask, so try the explicit
              # host-mask form first and fall back to the bare form.
              if sudo -n ifconfig "$interface" alias "$OVERLAY_ADDRESS" netmask 255.255.255.255 up 2>/dev/null \
                || sudo -n ifconfig "$interface" alias "$OVERLAY_ADDRESS" up 2>/dev/null; then
                echo "PROVISION overlay_interface=$interface"
                break
              fi
            done
          fi
          ifconfig -a | grep "$OVERLAY_ADDRESS" && echo "PROVISION overlay_alias=present" || echo "PROVISION overlay_alias=missing"
      - name: Test CI process supervision
        run: python3 -m unittest discover -s scripts -p 'ci_*_test.py'

      # Separate compilation from execution so a stuck test cannot hide the
      # completed compiler log. Both stages use precisely the same suite list.
      - name: Compile Rust test targets
        shell: bash
        timeout-minutes: 42
        env:
          TEST_SUITE: ${{ inputs.suite || 'full' }}
          CARGO_BUILD_TARGET: aarch64-apple-darwin
        run: python3 scripts/ci-run-bounded.py --timeout-seconds 2400 --log "$RUNNER_TEMP/ferryx-ci-logs/rust-compile.log" -- bash scripts/ci-native-tests.sh compile

      - name: Preserve successful native compilation if later tests fail
        # Keep the existing dependency cache scope; runtime fixture state is not cached.
        # Set only after the full selected target set compiled successfully.
        run: echo "CACHE_ON_FAILURE=true" >> "$GITHUB_ENV"

      - name: Cargo Test (unit and integration suites)
        shell: bash
        timeout-minutes: 32
        env:
          TEST_SUITE: ${{ inputs.suite || 'full' }}
          CARGO_BUILD_TARGET: aarch64-apple-darwin
        run: python3 scripts/ci-run-bounded.py --timeout-seconds 1800 --log "$RUNNER_TEMP/ferryx-ci-logs/rust-tests.log" -- bash scripts/ci-native-tests.sh run

      # The remote grid mirror spans Rust and TypeScript: this asserts real serialized backend
      # frames parse in the actual frontend parser. It lives here, not in the UI job, because it
      # needs the Rust toolchain and the Ghostty submodule.
      - name: Remote Grid Frame Seam (Rust -> TypeScript)
        # Reuse the explicit-target native test artifacts instead of rebuilding host crates.
        env:
          CARGO_BUILD_TARGET: aarch64-apple-darwin
        timeout-minutes: 7
        run: python3 scripts/ci-run-bounded.py --timeout-seconds 300 --log "$RUNNER_TEMP/ferryx-ci-logs/grid-seam.log" -- bun run --cwd ui src/remote/gridFrameSeam.check.ts

      - name: Preserve native stage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-stage-logs
          path: ${{ runner.temp }}/ferryx-ci-logs/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report final disk usage
        if: always()
        run: |
          df -h . "$RUNNER_TEMP"
          for directory in src-tauri/target remote-helper/target; do
            if [ -d "$directory" ]; then du -sh "$directory"; fi
          done

  # =========================================================================
  # LEGACY MATRIX: MANUAL DISPATCH ONLY
  # The ubuntu UI job and the Linux/Windows cargo legs stay available for an explicit
  # workflow_dispatch run; they are not part of the phase 1 pull-request precheck.
  # =========================================================================
  # =========================================================================
  # 1. FRONTEND UI VALIDATION
  # =========================================================================
  ui-check:
    if: github.event_name == 'workflow_dispatch' && inputs.legacy == true
    name: UI Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Release and packaging contract tests inspect git history; a depth-1 checkout makes
          # `HEAD~1` unresolvable and turns those contracts into false failures.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile || bun install
          bun install --cwd ui --frozen-lockfile || bun install --cwd ui
          bun install --cwd site --frozen-lockfile || bun install --cwd site

      - name: Verify release workflow policy
        run: bun scripts/release-workflow-policy.mjs

      # Backstop for the thread-ownership invariant: no GPU acquisition inside a
      # run_on_main_thread closure. The !Send tokens are the real enforcement, since a
      # lexical rule cannot follow a call into another function; this catches the direct
      # mistake. ast-grep comes from the @ast-grep/cli devDependency, not a system install.
      - name: Verify native terminal thread policy
        run: bun scripts/native-terminal-thread-policy.mjs

      # The gate must prove itself: this plants a violation, requires a non-zero exit, and
      # requires exit 0 on the clean tree. Without it a silently broken rule reports success.
      - name: Test native terminal thread policy gate
        run: bun test scripts/native-terminal-thread-policy.test.mjs

      - name: Build Frontend UI
        run: bun run --cwd ui build

      - name: Test Frontend UI
        run: bun run --cwd ui test

      - name: Test Landing Site
        run: bun test --cwd site

      # These packaging and release script tests were previously never executed in CI.
      - name: Test Release and Packaging Scripts
        run: bun test scripts/

  # =========================================================================
  # 2. RUST BACKEND VALIDATION ACROSS PLATFORMS
  # =========================================================================
  rust-check:
    if: github.event_name == 'workflow_dispatch' && inputs.legacy == true
    name: Rust Check (${{ matrix.os_name }})
    runs-on: ${{ matrix.platform }}
    # Same CMake 4 policy floor as the precheck job: audiopus_sys 0.2.2 bundles Opus with a
    # CMake 3.1 policy declaration, which current macOS and Windows runner images reject.
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os_name: 'macos'
            target: 'aarch64-apple-darwin'
          - platform: 'windows-latest'
            os_name: 'windows'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'ubuntu-latest'
            os_name: 'linux'
            target: 'x86_64-unknown-linux-gnu'

    steps:
      - name: 'Checkout repository (submodules: recursive)'
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Fixture suites re-clone this checkout and resolve `HEAD~1`; a depth-1 checkout leaves
          # a single commit, so git parses the argument as a path and the fixture dies with
          # "fatal: git checkout: --detach does not take a path argument 'HEAD~1'".
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install Linux system dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            clang \
            libclang-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libdbus-1-dev \
            libva-dev \
            libdrm-dev \
            libgbm-dev \
            libegl-dev \
            libgl-dev \
            libxcb1-dev \
            libxcb-shm0-dev \
            libxcb-randr0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxfixes-dev \
            libxtst-dev \
            libxi-dev \
            libevdev-dev \
            libudev-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Fixture suites commit through git. Hosted runners ship no global identity, so
      # `git commit` inside a fixture repository fails before the assertion under test runs.
      - name: Configure git identity for fixture repositories
        shell: bash
        run: |
          git config --global user.name "ferryx-ci"
          git config --global user.email "ferryx-ci@users.noreply.github.com"
          git config --global init.defaultBranch main

      # The rollout rehearsal and the worktree fixtures create temporary repositories under
      # TMPDIR and assert it is set (`isolated TMPDIR`), because a temp repository inside the
      # checkout is re-owned by git's ceiling rules. Hosted Linux runners ship no TMPDIR.
      - name: Isolate TMPDIR for fixture repositories
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          ISOLATED_TMPDIR="${RUNNER_TEMP}/ferryx-ci-tmp"
          mkdir -p "$ISOLATED_TMPDIR"
          echo "TMPDIR=$ISOLATED_TMPDIR" >> "$GITHUB_ENV"
          echo "GIT_CEILING_DIRECTORIES=$ISOLATED_TMPDIR" >> "$GITHUB_ENV"

      - name: Install Node/Bun dependencies
        run: |
          bun install --frozen-lockfile || bun install
          bun install --cwd ui --frozen-lockfile || bun install --cwd ui

      - name: Build Frontend UI (required for Tauri asset embed)
        run: bun run --cwd ui build

      - name: Cargo Check
        # The default remote-desktop feature links the pinned LGPL FFmpeg SDK first.
        shell: bash
        run: |
          bun scripts/fetch-ffmpeg.mjs --target ${{ matrix.target }}
          cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      # cargo check does not invoke link.exe, so it cannot catch mismatched Ghostty static and
      # import library directives. Link the Windows binary before allowing a release-tag PR through.
      - name: Cargo Link (Windows)
        if: matrix.os_name == 'windows'
        run: cargo build --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      # Owned filesystem/config contracts only: no daemon, GPU or user-profile mutation.
      # Expand this list only after the domain-specific isolation repairs are verified.
      - name: Cargo Test (Windows isolated contracts)
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            --target ${{ matrix.target }} \
            --test windows_edge_probe_contract \
            --test windows_window_opacity_contract \
            --test q4_windows_paths \
            -- --test-threads=1

      # q4_windows_paths above is the only end-to-end check that Git's worktree inventory and
      # WorktreeManager agree on Windows path identity. The step below executes the Windows-only
      # lib code no other job runs - above all the job-object containment in worktree/git/windows.rs,
      # which cargo check can only type-check. The worktree filter keeps the POSIX-only unit tests
      # that share the same test binary from running on this runner. daemon::server::
      # agent_state_transport_tests is named explicitly beside it: its tests carry no unix cfg, so
      # this is the only job that compiles and runs them. They cover the non-unix agent-state ingress
      # module's contracts - the rendezvous record shape, token matching, the publish/readiness
      # ordering and the endpoint invariant - not the ingress path itself: nothing here drives the
      # non-unix spawn_agent_state_listener accept loop that publishes agent-state.rendezvous.
      # The `worktree` name filter sweeps in remote::workspace_api::worktrees::authority_tests,
      # which drive the owner wire over a Unix-socket transport: on non-unix the daemon requires a
      # transport token (`#[cfg(not(unix))] transport_authenticated`) that those fixtures never
      # publish, because unix authenticates by socket ownership instead. They fail before their
      # assertions run (TRANSPORT_UNAUTHORIZED), so they are skipped here and tracked as a gap in
      # Windows coverage of the machine transport rather than reported as a product failure.
      - name: Cargo Test (Windows lib scope)
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            --target ${{ matrix.target }} \
            --lib \
            -- worktree \
            --test-threads=1 \
            --skip remote::workspace_api::worktrees::authority_tests::followthrough_delete_publication_blocks_spawn \
            --skip remote::workspace_api::worktrees::authority_tests::local_worktree_errors_survive_owner_wire_and_native_adapter \
            --skip remote::workspace_api::worktrees::authority_tests::owner_http_gate_and_eight_admissions
          cargo test --manifest-path src-tauri/Cargo.toml \
            --target ${{ matrix.target }} \
            --lib \
            -- daemon::server::agent_state_transport_tests \
            --test-threads=1

      # The ssh bridge and helper-setup suites execute the real helper binary: bridge_tests
      # asserts `remote-helper/target/debug/ferryx-remote-helper` exists before any assertion
      # runs, so without this step 15 bridge tests plus the upload-script test fail on a missing
      # file rather than on behaviour. The release pipeline stages helpers through
      # scripts/build-remote-helpers.mjs, but these suites only need the crate's debug build.
      - name: Build remote helper (debug, required by ssh bridge suites)
        if: matrix.os_name == 'linux'
        run: cargo build --manifest-path remote-helper/Cargo.toml

      # The P19 overlay gate suites need a CGNAT address on a non-loopback interface, as in the
      # precheck job. On Linux add it to the default-route interface as a /32.
      - name: Provision overlay address for host-dependent suites
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          OVERLAY_ADDRESS=100.64.1.2
          interface=$(ip -o -4 route show default | awk '{print $5; exit}')
          sudo -n ip addr add "$OVERLAY_ADDRESS/32" dev "$interface"
          ip -o -4 addr show | grep "$OVERLAY_ADDRESS" && echo "PROVISION overlay_alias=present on $interface"

      # Suites that cannot run on a hosted runner, each skipped with the reason it was measured
      # to fail. They stay verified on real hosts: the renderer contract suite on GPU hardware,
      # the gateway suites on a tailnet, the PTY saturation suites on a real kernel buffer.
      # `--lib` is what pulls them in, so the exclusion has to be spelled out here.
      #   native_terminal::renderer::      builds a real WGPU device and CoreText/locale fonts;
      #                                    llvmpipe plus a font-less image fails ink-density and
      #                                    rasterization assertions.
      #   remote::tests::test_remote_server_health_and_lifecycle and
      #   remote::tests::test_headless_handover_workspace_state_...  require an active Tailscale
      #                                    IPv4 interface ("no active Tailscale IPv4 interface found").
      #   daemon::client::tests::test_client_workspace_registration_and_remote_apis
      #                                    requires a reachable relay ("Timed out waiting for
      #                                    relay registration ACK").
      #   terminal::tests::test_spawn_startup_command_omo
      #                                    requires the omo agent CLI on PATH.
      #   remote::server::machine_input_cancellation_tests::,
      #   remote::tests::security::sockets::a10_pending_machine_input_is_dropped_on_disconnect_and_revoke,
      #   terminal::tests::a_wedged_pty_does_not_block_the_async_runtime_thread
      #                                    assert the kernel's socket/PTY queue capacity (11776
      #                                    bytes on Linux) instead of the macOS buffer they were
      #                                    written against.
      #   ssh::direct::tests::failed_probe_distinguishes_non_utf8_and_empty_stderr
      #                                    writes non-UTF-8 bytes with `printf '\xff\xfe\xfd'`
      #                                    through /bin/sh; dash on Linux prints those escapes
      #                                    literally, so the probe never produces invalid UTF-8.
      #                                    The suite is a host-shell contract, not a product one.
      - name: Cargo Test (renderer contract excluded)
        if: matrix.os_name == 'linux'
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            --target ${{ matrix.target }} \
            --lib \
            --test backend_hardening \
            --test daemon_persistence_contract \
            --test e2e_agent_workflow \
            --test ghostty_build_contract \
            --test ghostty_build_info_ffi \
            --test ipc_hardening_contract \
            --test native_terminal_capability_contract \
            --test native_terminal_child_surface_contract \
            --test native_terminal_composition_contract \
            --test native_terminal_engine_contract \
            --test native_terminal_input_boundary_contract \
            --test native_terminal_surface_host_contract \
            --test native_terminal_wayland_subsurface_contract \
            --test rorca_native_contract \
            --test session_persistence_integration \
            --test updater_config_contract \
            --test updater_endpoint_contract \
            --test worktree_safety \
            -- --test-threads=1 \
            --skip native_terminal::renderer:: \
            --skip remote::tests::test_remote_server_health_and_lifecycle \
            --skip remote::tests::test_headless_handover_workspace_state_selects_live_session_without_desktop_selection \
            --skip daemon::client::tests::test_client_workspace_registration_and_remote_apis \
            --skip terminal::tests::test_spawn_startup_command_omo \
            --skip remote::server::machine_input_cancellation_tests:: \
            --skip remote::tests::security::sockets::a10_pending_machine_input_is_dropped_on_disconnect_and_revoke \
            --skip terminal::tests::a_wedged_pty_does_not_block_the_async_runtime_thread \
            --skip ssh::direct::tests::failed_probe_distinguishes_non_utf8_and_empty_stderr

      # The remote grid mirror spans Rust and TypeScript: this asserts real serialized
      # backend frames parse in the actual frontend parser. It lives here, not in the ui
      # job, because it needs the Rust toolchain and the Ghostty submodule.
      - name: Remote Grid Frame Seam (Rust -> TypeScript)
        if: matrix.os_name == 'linux'
        run: bun run --cwd ui src/remote/gridFrameSeam.check.ts
