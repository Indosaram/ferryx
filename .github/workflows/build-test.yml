name: CI Build & Check

on:
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. FRONTEND UI VALIDATION
  # =========================================================================
  ui-check:
    name: UI Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile || bun install
          bun install --cwd ui --frozen-lockfile || bun install --cwd ui

      - name: Build Frontend UI
        run: bun run --cwd ui build

      - name: Test Frontend UI
        run: bun run --cwd ui test

      - name: Test Landing Site
        run: bun test --cwd site

  # =========================================================================
  # 2. RUST BACKEND VALIDATION ACROSS PLATFORMS
  # =========================================================================
  rust-check:
    name: Rust Check (${{ matrix.os_name }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os_name: 'macos'
            target: 'aarch64-apple-darwin'
          - platform: 'windows-latest'
            os_name: 'windows'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'ubuntu-latest'
            os_name: 'linux'
            target: 'x86_64-unknown-linux-gnu'

    steps:
      - name: 'Checkout repository (submodules: recursive)'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0

      - name: Install Linux system dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node/Bun dependencies
        run: |
          bun install --frozen-lockfile || bun install
          bun install --cwd ui --frozen-lockfile || bun install --cwd ui

      - name: Build Frontend UI (required for Tauri asset embed)
        run: bun run --cwd ui build

      - name: Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      # The renderer contract suite constructs a real WGPU device (GpuContext::new) and is
      # verified locally on GPU hardware instead; hosted runners have no reliable adapter.
      # daemon_persistence_contract shares on-disk daemon state, so tests run single-threaded.
      - name: Cargo Test (renderer contract excluded)
        if: matrix.os_name == 'linux'
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            --target ${{ matrix.target }} \
            --lib \
            --test backend_hardening \
            --test daemon_persistence_contract \
            --test e2e_agent_workflow \
            --test ghostty_build_contract \
            --test ghostty_build_info_ffi \
            --test ipc_hardening_contract \
            --test native_terminal_capability_contract \
            --test native_terminal_composition_contract \
            --test native_terminal_engine_contract \
            --test native_terminal_input_boundary_contract \
            --test native_terminal_surface_host_contract \
            --test rorca_native_contract \
            --test session_persistence_integration \
            --test worktree_safety \
            -- --test-threads=1
