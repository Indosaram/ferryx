name: tpi-t42-wincli
on:
  push:
    branches: ['ci/tpi-t42-wincli']
permissions:
  contents: read
jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      CARGO_INCREMENTAL: '0'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - run: git config --global core.longpaths true; git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 1 }
      - uses: mlugg/setup-zig@v2
        with: { version: 0.16.0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './src-tauri -> target', key: tpi-t42-wincli }
      - name: deps
        run: bun install --frozen-lockfile; if ($LASTEXITCODE -ne 0) { bun install }
      - name: Gate
        continue-on-error: true
        shell: pwsh
        run: pwsh -NoProfile -File .github/tpi42/gate-win.ps1
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: tpi-t42-wincli-win, path: ci-logs/ }
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - name: Gate
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p ci-logs
          bun install --frozen-lockfile || bun install
          for t in scripts/release-platforms.test.mjs scripts/install.test.mjs scripts/build-latest-json.test.mjs scripts/release-contract.test.mjs; do
            n=$(basename $t .mjs); bun test $t > ci-logs/$n.log 2>&1; echo "$n exit=$?" | tee -a ci-logs/exits.txt; tail -4 ci-logs/$n.log
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: tpi-t42-wincli-linux, path: ci-logs/ }
