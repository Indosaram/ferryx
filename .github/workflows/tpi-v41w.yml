name: tpi-v41w
on:
  push:
    branches: ['ci/tpi-v41w']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 0 }
      - uses: mlugg/setup-zig@v2
        with: { version: 0.16.0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './src-tauri -> target', key: tpi-v41w-win }
      - name: UI build
        shell: bash
        run: |
          bun install --frozen-lockfile || bun install
          bun install --cwd ui --frozen-lockfile || bun install --cwd ui
          bun run --cwd ui build
      - name: Gate
        continue-on-error: true
        shell: bash
        run: bash .github/v41/win2.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: tpi-v41w-windows, path: ci-logs/ }
