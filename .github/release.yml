changelog:
  exclude:
    labels:
      - ignore-for-release
      - skip-changelog
    authors:
      - octocat
  categories:
    - title: Features 🎉
      labels:
        - feature
        - enhancement
    - title: Bug Fixes 🐛
      labels:
        - bug
        - fix
    - title: Performance Improvements ⚡
      labels:
        - performance
        - perf
    - title: Documentation 📝
      labels:
        - documentation
        - docs
    - title: Maintenance & Dependencies 🛠
      labels:
        - maintenance
        - chore
        - dependencies
    - title: Other Changes
      labels:
        - "*"
