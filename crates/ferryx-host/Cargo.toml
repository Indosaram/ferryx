[package]
name = "ferryx-host"
version = "0.1.0"
edition = "2021"
description = "Ferryx session host: owns PTYs and the replicated terminal state, serves FXSH over per-user local IPC"
license = "MIT"
publish = false

[lib]
name = "ferryx_host"
path = "src/lib.rs"

[[bin]]
name = "ferryx-host"
path = "src/main.rs"

[dependencies]
ferryx-fxsh = { path = "../fxsh" }
ferryx-session-core = { path = "../session-core" }
ferryx-vt = { path = "../ferryx-vt" }
portable-pty = { version = "0.9", path = "../../src-tauri/vendor/portable-pty" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_Networking_WinSock",
] }

[dev-dependencies]
tempfile = "3"

[workspace]
