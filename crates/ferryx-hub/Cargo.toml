[package]
name = "ferryx-hub"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Always-on Ferryx hub: meta-agent, chat ingress, lanes, tracker, and cron"
license = "MIT"
publish = false

[features]
default = []
# Slack Socket Mode ingress and egress. Off unless the daemon is built with this feature.
hub-slack = ["dep:reqwest", "dep:tokio-tungstenite", "dep:futures-util"]
# Discord gateway adapter. Off unless the daemon is built with this feature.
hub-discord = ["dep:reqwest", "dep:tokio-tungstenite", "dep:futures-util"]
# Reserved. Voice and huddle stay parked and are not ported.
hub-voice = []

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "json"] }
tokio-tungstenite = { version = "0.26", optional = true, features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }

[workspace]
