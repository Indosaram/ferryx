[package]
name = "ferryx-hub"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Always-on Ferryx hub: meta-agent, chat ingress, lanes, tracker, and cron"
license = "MIT"
publish = false

[features]
default = []
# Slack Socket Mode ingress and egress. Off unless the daemon is built with this feature.
hub-slack = ["dep:reqwest", "dep:tokio-tungstenite", "dep:futures-util"]
# Discord gateway adapter. Off unless the daemon is built with this feature.
hub-discord = ["dep:reqwest", "dep:tokio-tungstenite", "dep:futures-util", "dep:songbird"]
# Speech client. Idle until a speech key is configured. The huddle sidecar is bun.
hub-voice = ["dep:reqwest"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
cron = "0.15"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "json", "multipart"] }
tokio-tungstenite = { version = "0.26", optional = true, features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", optional = true }
songbird = { version = "0.5.0", optional = true, default-features = false, features = ["driver", "gateway", "rustls", "receive", "tungstenite"] }
plist = "1.10"
usvg = "0.48.1"
resvg = "0.48.1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }

[workspace]
