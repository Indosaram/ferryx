[package]
name = "ferryx-rd-windows-stdio-contract"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
ferryx-rd-proto = { path = "../../../ferryx-rd-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tracing = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rustix = { version = "1.0", features = ["event", "net"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Threading"] }
