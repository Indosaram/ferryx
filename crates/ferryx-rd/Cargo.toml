[workspace]
resolver = "2"
members = [
    "ferryx-rd-proto",
    "ferryx-rd-relay",
    "ferryx-rd-net",
    "ferryx-rd-decode",
    "ferryx-rd-render",
    "ferryx-rd-app",
    "ferryx-rd-host",
    "ferryx-rd-mobile",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
openssl = { version = "0.10", features = ["vendored"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
ffmpeg-next = { version = "9", default-features = false }
cpal = "0.17"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rustix = { version = "1.0", features = ["net", "event", "fs"] }
