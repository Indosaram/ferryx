[package]
name = "ferryx-rd-decode"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["ffmpeg"]
ffmpeg = ["dep:ffmpeg-next"]
d3d11va = ["ffmpeg"]
videotoolbox = ["ffmpeg"]
vaapi = ["ffmpeg"]
ios-videotoolbox = []

[dependencies]
opus = "0.3.1"
audiopus_sys = { version = "0.2.2", features = ["static"] }
ferryx-rd-proto = { path = "../ferryx-rd-proto" }
ffmpeg-next = { workspace = true, optional = true, default-features = false, features = ["codec", "format", "software-scaling"] }
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true

[[example]]
name = "decode_smoke"
required-features = ["ffmpeg"]
